# by test_enemy_ai_e2.cpp).

# E2.1 ON-ORDER RUNS (lock L1: the strike order had NO TRANSIT VERB — its only
# consumer was a parasitic divert that required a run to already be passing the
# stope, and run scheduling is a trait-period countdown that knows nothing
# about the order). A live order now COLLAPSES the countdown.
#
# ! FOR CHAD'S FLY CHECKLIST: this is SYMMETRIC — BOTH factions' strike tempo
#   rises, so a match can now be decided by pump destruction with or without
#   him. Enemy-only is available (it would be a faction test at the arming
#   site) and is his call; symmetric ships, because the fair-war shape is what
#   the rest of the conquest loop already has.
#
# The collapse is ONE-SHOT per loaded countdown and NEVER overrides the merge
