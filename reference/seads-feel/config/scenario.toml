transit_fight_yield_m = 2500.0
# E3.2 THE CONCURRENT-STRIKER CAP: at most this many pilots PER FACTION may
# hold a collapse-TRIGGERED run at once (TRANSIT through CLIMB_OUT). The others
# keep their standing order with the countdown COLLAPSED-PENDING — the one-shot
# is not burned, so a held pilot launches the tick a slot frees. Natural
# trait-period runs are NOT capped (the old flavour stands). This is what keeps
# the wing on PATROL, where RUNG E1 makes them dangerous, instead of all-in-
# transit from match start. 0 = uncapped = the E2 tempo.
strike_concurrent_max = 1

