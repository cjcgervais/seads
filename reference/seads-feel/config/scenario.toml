bfm_fight_speed_mps = 120.0  # [m/s] base speed for Offensive/Yoyo/Extend/break
bfm_intercept_speed_mps = 265.0  # [m/s] straight-line chase ceiling

# ★★★ RUNG S3-GUNS — THE UN-FADE. CHAD, 2026-08-26: "attack me ... stop nerfing
# them in secret", and, asked what to give back for it, "Nothing - leave it at
