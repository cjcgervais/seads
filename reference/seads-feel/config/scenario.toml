# ★ WHAT THE INSTRUMENT ACTUALLY SAYS (probe P-A sweep, n=64 x 10 min per arm,
# rates per engagement). THE EFFECT DOES NOT SURVIVE CONVERGENCE:
#     fight_speed    0     120     150     180     210
