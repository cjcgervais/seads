# ---------------------------------------------------------------------------
# ★★★ S2-TUNNEL — THE RAID ROUTER (Chad's ruling 2026-08-26, verbatim)
# ---------------------------------------------------------------------------
# "if they are leaving for a raid on a pump, the surface one, they should
#  actually use the tunnel, that is what it is there for, no more crossing over
#  the thin air zone ... although I can still and do cross the zones on deck as
#  its not always easily accessible ... also a few designated runs crossing the
#  deck to make a run on the pump is okay, but I would prefer actually if the ai
#  were more conservative than say a player might be and that they would choose
#  to cross via the tunnel."
#
# THE BLOCKER THIS OPENS, and it was one line: drone::tick froze the maverick
# run scheduler whenever a RaidOrder was armed (`hold_runs`), so a designated
# raider could NEVER enter the bore. The raid and the tunnel machine were
# mutually exclusive BY CONSTRUCTION — which is why Chad's 2026-07-26 standing
# mission (Murray -> the stope -> Errington -> the VALLEY surface pump) has
# never once been flown by the raid code.
#
# THE VERDICT is measured app-side every tick from the DRONE'S OWN POSITION and
# compares two arcs of thin air (outside BOTH domes, read off the same
# world::ellipse_r_eff the containment leash and the plant read):
#   direct  = drone -> pump
#   tunnel  = drone -> own mouth, plus far mouth -> pump  (the bore holds full
#             air unconditionally and the crash predicate is suspended inside
#             the net, so the bore leg contributes ZERO)
# Route by the tunnel iff direct > raid_route_gap_max_m AND tunnel < direct.
# The comparison (not "tunnel always") is the MID-MATCH FALLBACK: a faction
# that loses a pump halves its dome, and on tape 12 at k=55853 BOTH mouths sat
# outside their own domes — tunnel-always would then march raiders into worse
# vacuum than the direct crossing.
raid_route_via_tunnel = true
# How many of a faction's top-ranked live raiders keep the DIRECT deck run —
# Chad's "a few designated runs crossing the deck ... is okay", his own number.
# Ranked by combat::faction_raider's OWN aggression order (one ranking
# authority, deterministic, no rng). 0 = strictly tunnel for everyone.
raid_deck_run_slots = 1
# [m] thin-air arc on the direct track that is still tolerable. Below this the
# direct route is simply flown — the router never fires for an in-dome pump.
raid_route_gap_max_m = 500.0
# [s] per-index stagger on the raid's bore entry, the strike_stagger_s shape,
# so entries are one-at-a-time instead of a synchronised swarm.
raid_route_stagger_s = 10.0
# C1 — THE ERRAND SPEED [m/s]. Neither the raid nor the defend branch ever set
# a speed_target, so both inherited the PURSUIT bump and loitered at a measured
# 156 m/s, where the minimum turn radius at the 64.7 deg cap is 1173 m against
# combat/raid.h's raid_range_m = 1000 m: the raider structurally could not hold
# the envelope it is graded on. At 123 m/s the radius is 729 m. 0 = OFF =
