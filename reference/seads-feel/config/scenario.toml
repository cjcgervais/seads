#     hits/eng     0.39    0.47    0.25    0.42    0.36
#     in_band/eng  1258    1223    1334    1440    1463
#     foe_min/eng  9.63    9.79    9.91    9.87   10.05
# The whole spread on rounds/hits is ~1.2x with no monotone shape -- inside the
# band spec E7.I forbids ruling on (n=64 resolves 2x, NOT 20%). An n=32 pass
# showed a clean interior optimum at 120-150 (rounds 2.66, hits 0.59); it was
# NOISE and did not reproduce. No acceptance here may claim an improvement.
#
# ★★ CORRECTED (rung E9, on the E8 red team's P0-6 -- spec §E9.6). This block
# said "THE TWO STABLE COLUMNS DO MOVE, MONOTONICALLY: in_band +16% and
