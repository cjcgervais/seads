# it re-creates the measured R4 bug where a committed TRANSIT marched a fighter
# away mid-merge, a free kill for an ace). false = today.
strike_on_order  = true
# [s] per-index stagger of the collapsed countdown: pilot i waits
# strike_stagger_s * (1 + i). Entries stay one-at-a-time, and the (1 + i) shape
# gives pilot 0 a real floor — a bare i*stagger would chain his runs
# back-to-back with no patrol between them. 10 s spreads the 10-pilot roster
# over 100 s, comfortably inside the shortest trait period (75 s).
strike_stagger_s = 10.0

# E2.2 A DIVERT THAT REACHES (lock L2). These were welded into
# drone::StrikeOrder's struct defaults where no config could reach them.
# 6500 -> 9000 m. The engage sphere has to cover the whole flyable chamber, not
# a fraction of it: the arena's horizontal semi-axis alone is 7.35 km at the
# test table, so a striker that entered by the FAR mouth (the ruled entry
# direction, E2.1) was still outside 6500 m of its target for the first third
# of the crossing and flew the spine straight past it. in_arena still gates the
# divert, so a wider radius can never fire it outside the stope.
strike_engage_m       = 9000.0  # [m] divert radius around the deep pump
strike_k_az           = 3.5     # bank gain toward the pump
strike_k_el           = 3.0     # gamma gain toward the pump
strike_bank_cap_deg   = 65.0    # [deg] (== the maverick bore bank cap)
# 35 -> 50 deg. MEASURED: the deep pump sits ~kDeepPumpFrac (0.6) of the
# arena's horizontal semi-axis toward its OWN mouth, i.e. on the FAR side from
# the striker's entry mouth, and the arena center is ~4.1 km underground — the
# required descent is ~42 deg, which the old 35 deg cap could not fly, so the
# divert never arrived (on_station 0.0 s). 50 clears it with margin. The bound
# is deliberate at BOTH ends and the loader enforces both against config, not
# against a number: above maverick run_gamma_cap (44 deg, the steep bore ascent
# this same autopilot already flies) and below dive_gamma_cap (55 deg, the pit
# plunge — the steepest angle it is ruled to fly anywhere). The floor/ceiling
# safety case at 50 deg is aim_at's error-nulling (it levels out AT pump
# altitude, and the pump sits ~2 km above the arena floor) PLUS the
# arena-shell wall guard below, which applies to the divert as well as to the
# E2.4 fight interrupt.
strike_gamma_cap_deg  = 50.0
# 90 -> 150 s. The budget has to fund the there-and-back detour off the spine
# at run speed across an arena whose horizontal semi-axis alone is 7.35 km.
strike_bail_s         = 150.0
# 600 -> 2000 m. SIZED TO THE MACHINE, and measured. A striker carries ~180 m/s
# out of its descent into the stope (the autothrottle command is the bore's
# 135, but a 50-deg dive is flown by gravity and the throttle is already at 0),
# so its turn radius under the 65-deg bank cap is ~1.5 km and its pursuit loop
# around a POINT target is ~3 km across: at the inherited 600 m a striker could
# only ever cross the window in instants. 15 sim-minutes of probe P-B credited
# 9.9 s of on-station time and the pump never fell. This is the SAME argument
# and the SAME fix as the game-AI-R3 surface retune, which moved the raid
# envelope 800 -> 1000 m because "brief strafe instants at cruise turn radius"
# made a pump take the better part of an hour; the stope striker simply flies
# faster, so its loop is bigger. Measured at the shipped table: 600 -> 9.9 s,
# 1000 -> 15.9 s, 1500 -> 23.7 s, 2000 -> 30.0 s and pumps[2] destroyed at 6:53
# of the 15-minute window.
#
# ! FOR CHAD: THIS IS THE PUMP-KILL-RATE DIAL. It is an ABSTRACTED DPS envelope
#   (combat::raider_on_station), not a hit test - no round has to connect - so
#   widening it makes deep pumps fall faster for BOTH factions. The TRACERS are
#   deliberately NOT widened with it: rounds still leave only inside the gun's
#   own band (see strike_strafe).
strike_station_range_m = 2000.0 # [m] on-station envelope (the strafing window)
strike_station_cos     = 0.35   # cos of the on-station cone (~70 deg)
# ---------------------------------------------------------------------------
# RUNG E18 — THE DIVE THAT ARRIVES (Chad flew tapes 10 AND 11; "it looks like
# one of them may have crashed the tunnel")
# ---------------------------------------------------------------------------
# EVERY in-net wreck across both tapes -- seven of them -- dies 33-54 m BELOW
# the deep pumps' own radius (the pumps sit at |pos| 11289.9). It is the STRIKE
# DIVERT, not the bore: all three of tape 10's runs arm the divert at the MOUTH
# (R ~15020, slant ~8990 m == strike_engage_m 9000) and are dead ~63 s later,
# still 2.3-3.6 km SHORT of the pump.
#
# THE ARITHMETIC: the pump is ~3750 m below over ~8160 m of ground track -- a
# 24.7 deg glide. strike_k_el 3.0 x that is 74 deg, so the command SATURATES at
# strike_gamma_cap (50 deg) and holds. At 50 deg over 8160 m you spend 9715 m
# of altitude when only 3750 m exists: a 2.6x overspend, so the striker meets
# the arena floor kilometres before it meets the pump.
#
# ★ THIS IS E17's RAID DEFECT UNDERGROUND -- a saturated pure-pursuit at a
# POINT TARGET WITH A FLOOR RIGHT UNDER IT. Same law: THE FIX FOR A SATURATED
# PURSUIT IS GEOMETRY, NOT GAIN.
#
# strike_attack_alt_m: aim this far ABOVE the pump (which itself stands only
#   ~35 m off the arena floor, so aiming AT it aims at the floor). The DAMAGE
#   envelope is untouched -- it stays keyed on the pump -- this moves the
#   AEROPLANE only. 300 m is well inside the 2000 m on-station window
#   (loader-checked) so the striker is never steered out of the strafing band.
# strike_glide_limit: never dive steeper than the straight glide to the aim
#   point. Measured to get the striker to the pump (closest 79/64 m) but NOT to
#   keep it alive on its own, so it ships FALSE -- built, measured, off.
#
# ★ MEASURED, [.e18dive] (closed-loop, shipped net + real DEM, seeded from the
# exact ticks tape 10 recorded each divert arming), closest approach i=7/i=9:
#     OFF               1463 m / 420 m   both CRASHED at -50/-69 m vs the pump
#     attack_alt 300     337 m / 443 m   both SURVIVED
#     glide only          79 m /  64 m   arrived, still crashed
#     attack_alt 500     506 m / 512 m   arrived, still crashed
#
# ⚠ CRASH-VS-SURVIVE IS NOT MONOTONE HERE (300 survived; 150, 500 and
# alt+glide did not) -- a binary outcome of a chaotic 90 s flight, i.e. the
# probe noise-floor law. SO THIS RUNG DOES NOT CLAIM TO HAVE STOPPED THE WRECK.
# It claims what the numbers support monotonically: the strikers now REACH the
# deep pump instead of burying themselves kilometres short, and no arm dies
# deeper than OFF. The residue is a PULL-OUT problem -- the divert closes to
# 64-500 m on a pump 35 m off the floor when the on-station envelope is 2000 m,
# a pure pursuit with nothing telling it to stop. That is the next rung.
#
# ★★★ AND SO IT SHIPS **OFF** (0.0), BUILT AND MEASURED -- the E15/E17
# precedent -- FOR ONE REASON THAT IS NOT ABOUT THE FIX'S MERIT: turning it on
# perturbs probe P-B's OWN CONTROL ARM. P-B asserts REQUIRE_FALSE(pre.
# pump_dead[2]) -- "without the divert the stope pump survives" -- and with
# this dial on, the PRE arm kills it. A change that moves the control of the
# probe that grades it cannot be graded by that probe, and a gate is not
# something to bend to green. What the dial DOES buy, measured on P-B's POST
# arm, is real and worth his ruling:
#     run_crashes    10 -> 0
#     total crashes  32 -> 19..23
#     the deep pump  NEVER DIED -> DIES (dead2=1, kill_t2 ~307-367 s)
# The cost is the strafing READ: closest approach 300 -> 695..834 m, so the
# gun's own cone stops closing and strafe_rounds goes to 0 -- the pump falls
# on the app-side DPS with no tracers to watch. A fade (full offset beyond the
# on-station envelope, blended to zero by half of it) was built to keep the
# last of the pass nose-on; it is in drone/drone.h and dormant at 0.0.
# To turn it on: strike_attack_alt_m = 300.0.
strike_attack_alt_m    = 0.0
strike_glide_limit     = false
# While the divert owns the run, defer the RUN's exit_frac flip to CLIMB_OUT —
# else a run that reaches exit_frac mid-strafe climbs out with the pump still
# alive. Belt-and-braces: s_est stagnates off-spine anyway. false = today.
strike_defer_exit = true
# E2.3 THE UNDERGROUND STRAFE (lock L3, and the visible half of it): while
# on-station, spawn REAL rounds at the pump. They already fly in the net (T10)
# and the stope has full air. The DAMAGE stays on the existing app-side
# damage_pump DPS path — there is no enemy-round-vs-pump hit test, so no double
# count and no balance derivation moves; the rounds are the tracer read and the
# audible warning next to the existing raided_pump HUD ring. false = today (the
# strike is silent DPS with no tracers at all).
#
# The TRACER band is the GUN's own [fire_range_min, fire_range_max], NOT the
# wider on-station DPS envelope above - spawning rounds out at 2 km would
# re-create exactly the long-range lobbing E1.2's snapshot band exists to
# forbid. Pinned by P-B: max spawn range 898 m against fire_range_max 900.
strike_strafe = true

# E2.4 THE CHAMBER FIGHT (the other half of lock L3: every underground mode is
# maverick_committed, so pursue()/BFM are bypassed and wants_fire is forced
# false — the player defending his own deep pump has never been shot at). A
# committed runner/striker that meets an enemy inside the stope takes a
# BUDGETED fight interrupt; a non-committed pursuer that follows him down is
# exempted from the terrain-avoid pull-up (which underground means "climb into
# the ceiling"). 0 = the whole block off.
arena_fight_range_m = 3000.0  # [m] foe range inside the arena that interrupts
arena_fight_s       = 25.0    # [s] interrupt budget per encounter; after it
                              #   the divert/run resumes (the interrupt borrows
                              #   the run, it never ends it)
# [deg] gamma clamp while the interrupt owns the tick, applied at the FINAL
# command so pursue's k_el+pull and bfm's yo-yo climb are both clamped at one
# seam. Tighter than pursue_max_gamma (30) by construction — the arena is
# ~2.6 km of vertical semi-axis against ~4.2 km horizontal, so a sustained
# 30-deg climb runs out of chamber long before it runs out of authority.
arena_gamma_cap_deg = 25.0
# The arena-shell WALL GUARD: the bore wall guard itself
# (maverick::update_wall_guard), reused against the chamber shell. It is the
# fallback steering for the divert, for the E2.4 fight interrupt, and for the
# whole time a striker is in the chamber - all of which fly with the terrain
# net disarmed. 0 = off.
#
# THREE THINGS WERE MEASURED HERE, each after a wrong version of this guard put
# strikers into the rock in probe P-B:
#  1. THE UNITS ARE METRES. A normalized-radius form (0.85 of the ellipsoid
#     radius) engages FAR too late on the oblate short axis - the stope is
#     2.6 km of vertical semi-axis against 7.35 km horizontal, so the same
#     FRACTION is a third of the distance going down. Every diverting striker
#     hit the shell at a normalized radius of 0.9999 with the guard latched.
#  2. IT STEERS THE INWARD NORMAL, NOT THE ARENA CENTRE. On a flank the nearest
#     wall is mostly BELOW, so the normal is mostly a CLIMB - a pitch change
#     made in a few hundred metres - while the centre lies ~90 deg off a
#     tangential heading and asks for a full turn radius (1.5 km at the
#     ~180 m/s a striker carries out of its descent). Centre-steering could not
#     be funded by any margin this chamber has room for.
#  3. IT OWNS THE WHOLE TIME A STRIKER IS IN THE CHAMBER, not only the ticks
#     the divert steers: a striker whose bail budget expires mid-chamber is
#     handed back to bore_track, which sees the spine 4 km away and 2 km up
#     (the bore threads the stope near its ceiling) and commands a saturated
#     climb - it flew into the CEILING at +44 deg with the guard released.
# With all three, in-arena crashes went 14 -> 0 per 15 minutes. The margin is
# loader-CHECKED against the pull-out arithmetic at the airframe redline rather
# than trusted as a number; 1100 m is that bound (1019 m) plus a little.
arena_guard_margin_m  = 1100.0
arena_guard_release_m = 1600.0

