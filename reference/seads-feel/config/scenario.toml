# SEADS scenario — the target drone + (Stage 2) lead gunsight (SPEC §0
# S8-drone). Tune data, loaded live like [ui]/[camera] so the bandit and the
# gunsight tune WITHOUT a recompile. NOT a coefficient of the flight model —
# nothing here can move the player's controller/plant golden.

[drone]
# A FLEET scattered over the world ("it's a big place"): drone 0 spawns ahead of
# the player (the immediate target), the rest scatter evenly over the sphere.
count = 10   # number of bandits
size  = 1.0  # draw scale — TRUE SCALE (Task C, iter-8). The model's real span
             #   is ~9.925 m; size=4 rendered bandits ~40 m wide, defeating range
             #   perception. Now drawn at real dimensions; identifiability restored
             #   by BANDIT labels (Task D).
# The flight PROGRAM (Chad 2026-07-07): a patrol, mostly LINEAR with periodic
# course changes — fly a straight great-circle leg for `straight_time`, then hold
# a gentle bank for `turn_time` (direction alternates so it weaves, not spirals),
# repeat. Purely scheduled by the drone's tick age (deterministic). Set
# turn_time = 0 (or turn_bank_deg = 0) for a pure straight great circle.
straight_time = 8.0    # [s] straight-leg duration (bigger = more linear)
turn_time     = 4.0    # [s] turn-leg duration (0 = never turn)
# The dedicated autopilot HOLDS this bank during a turn leg, so the turn is
# gentle and controllable: turn rate = g*tan(bank)/V (25 deg -> ~1.9 deg/s at
# 140 m/s). Any bank works now (no bistability). Raise for a tighter turn.
turn_bank_deg = 25.0   # [deg] bank angle held during a turn leg
throttle      = 1.0    # [0,1] cruise power (holds speed / altitude)
speed         = 85.0   # [m/s] bandit cruise. Lowered 140->115->95->85 (Chad fly 2026-07-14 "a couple flew away and would take long to catch — slow them a little more"): player cruises ~167 / redlines 245, so 85 gives ~82 m/s cruise closure (much more in a dive) — a fleeing/patrolling bandit is now clearly catchable. Also turns TIGHTER (turn rate = g*tan(bank)/V rises as V drops), so slower = a better dogfighter too. Raise toward 140 for a harder chase.
# Spawn placement, relative to the player spawn (ahead along its nose, beside
# along its right wing, at the same altitude) so the bandit is visible on the
# first flight.
spawn_ahead = 1200.0   # [m] drone 0 ahead of the player spawn nose
spawn_side  = 250.0    # [m] drone 0 lateral (right wing) of the player spawn
spawn_alt   = 2000.0   # [m] AGL (matches the player spawn altitude)
spread_m    = 3000.0   # [m] the rest of the fleet scatters within this arc-
                       #   radius of the spawn AREA -> a VISIBLE cluster you fly
                       #   into. Raise for a wider patrol (up to ~47000 = the far
                       #   side); lower for a tight furball.
hp = 100.0         # [HP] health points (> 0); ~4 point-blank cannon hits kill (more at range under KE falloff)
hit_radius_m = 9.0   # [m] swept-sphere collision radius (> 0). Re-derived for
                     #   TRUE scale (Task C, iter-8): old 15 m was sized for size=4
                     #   (40 m wingspan); at true scale the half-span ≈ 4.96 m.
                     #   9 m = true half-span (~5 m) + arcade margin (~4 m) so
                     #   "if the tracers look on the plane, they hit".

[maverick]
# THE MAVERICK SQUADRON (drone/maverick.h): the 10 patrol bandits become named
# tunnel-running adversaries — they dive into the Errington pit, thread the
# underground bore to Murray (-2000 m), pop out and reverse, staggered so you
# regularly witness (and can chase) a run. enabled=false makes the fleet
# BIT-IDENTICAL to the docile patrol (the maverick brain is never called).
# NOTHING here touches the flight kernel: the brain reads the tunnel geometry
# and emits bank/gamma/gain/speed setpoints for the SAME bank-hold autopilot.
# The per-pilot flavour (callsigns, speed_scale, aggression, run period,
# daredevil) is a constexpr TRAIT TABLE in drone/maverick.h.
enabled = true

# Speeds [m/s]. base_speed is the reference cruise the per-pilot speed_scale
# (1.15..1.55) multiplies; tunnel_speed_max is the HARD ceiling inside the bore
# (the honest speed cap the closed-loop run threads); transit_speed_scale paces
# the dash out to the mouth. All validated within [1.3*V_stall, v_redline].
base_speed          = 130.0
tunnel_speed_max    = 135.0   # the honest bore-speed ceiling: fast enough for a
                              #   thrilling run, slow enough that the bank-hold
                              #   autopilot threads the -2000 m dip (a higher cap
                              #   loses the descent curve; see docs/maverick_squadron.md)
transit_speed_scale = 1.0

# Pure-pursuit lookahead [m]. lookahead_m is the centreline chase distance in the
# bore (scaled by speed); dive_lookahead_m is the tighter aim into the pit throat.
# FIX-F4 (docs/ai_phase2_fix_spec.md, Opus probe attribution
# D:\seads_sandboxes\ai-probes\f4\ATTRIBUTION.md): 220 -> 500. The probe traced
# 69% of net entries dying (24/25 on the Errington bore ramp): DIVE_IN crosses
# the mouth ~30 deg nose-low at 173-183 m/s, the roll command saturates at
# bank_cap for 2.5 s because lookahead_m 220 (~334 m effective at speed) is
# only 0.21x the achievable turn radius (1574 m at 182 m/s / 65 deg bank), so
# the cross-track runs out to exactly tube_width_m and the plane exits
# contains() 580-720 m in. The pursuit lead must be sized to the turn radius
# actually achievable at the speed actually flown, not to the bore's own
# width. Measured: fleet in-net deaths 69% -> 21% over 60 min, the lateral
# bore-wall death mode eliminated (what survives is an unrelated pit-crown
# clip at the mouth, a separate defect). Dial — flagged for Chad's stick.
lookahead_m      = 500.0
# FIX-F4b — the residual "pit-crown" class (Opus probe,
# D:\seads_sandboxes\ai-probes\f4\PITCROWN_ATTRIBUTION.md + the repo copy in
# docs/ai_phase2_records/): 150 -> 250. The prior doc's label was wrong — the
# strike is the Errington PIT FLOOR, not a crown: BOREAL crosses the pit lip
# 132 m off-axis in the saturated 55-deg plunge, contains() fires via the
# trench at grade, RUN's altitude reference lands at the mouth node 220 m
# below (crater bottom), and track_gain*alt_err commands a further full-cap
# -44 deg dive; pull-out needs 1.4-1.9 s, it has 0.35 s. One byte-identical
# event = 19/25 in-net deaths over 150 min. The longer dive lead moves the
# aim ALONG the bore — a bearing change the roll channel can act on before
# saturation: lip state goes 132 m radius/+52 m cross-track/-65 deg pinned
# -> 88.9 m/-18 m/+19.2 deg unsaturated, and the pit radius then converges.
# Measured: pit class 19/51 Errington entries -> 0/40 over 150 min (total
# in-net 32% -> 8%); 350 measures the same (not a knife edge). Aim-sinking,
# crater widening, and a projected-contact guard all measured USELESS (both
# channels saturated; the fatal axis is vertical, the guard's actuator is
# lateral). Dial — flagged for Chad's stick.
dive_lookahead_m = 250.0
# Cross-track (centreline) correction gain. Pure pursuit alone cuts the inside of
# the bore's vertical dip curves; this restoring pull keeps the nose on centre.
# Tuned high — the run needs tight tracking through the dip.
# FIX-F4: 2.0 -> 1.0, paired with the lookahead_m raise above. At the old gain
# the cross-track term dominated the (now longer) lead vector into the same
# k_az saturation the lookahead raise was meant to relieve; halving it keeps
# the restoring pull from re-saturating the roll command. Measured together
# with lookahead_m=500: 69% -> 21% over 60 min (matching lookahead alone; what
# remains is the pit-crown clip, not the lateral bore-wall mode). Dial —
# flagged for Chad's stick.
centerline_gain = 1.0

# PATH-SLOPE FEEDFORWARD (the curvature-ff bore autopilot rung). The bore's steep
# exit ascent defeats an error-only pursuit gamma (a violent pitch PIO), so the
# run commands the PATH's own climb angle directly and lets the residual PD
# correct only the leftover altitude error. gamma_lookahead_m samples the slope
# this far AHEAD so the dip->climb knee is anticipated; track_gain [rad/m] is the
# gentle residual altitude-error gain.
gamma_lookahead_m = 300.0
slope_ff_gain     = 1.0     # 1 = full path-slope inversion; 0 reverts to the
                            #   error-only pursuit gamma (the pre-fix ascent PIO)
track_gain        = 0.0045
# THROTTLE FEEDFORWARD. A sustained climb needs ~sin(gamma) more thrust; feed it
# forward (climb_throttle_gain * sin(gamma_cmd)) so speed doesn't have to sag
# first to summon it. climb_speed_min is the sustainable climb speed the run
# bleeds toward on the ramp (instead of chasing the flat-run speed up a 21 deg
# slope), validated above stall like every other maverick speed.
climb_throttle_gain = 1.3
climb_speed_min     = 118.0

# Wall guard (hysteretic). Engage the centreline-recover when nearer than
# wall_margin_m to a bore wall; release only when wall_margin_release_m deep back
# inside (the anti-chatter gap). wall_margin_floor_m is the hard floor the
# daredevil trait cannot shrink past. Margins must stay below the bore semi-axis.
wall_margin_m         = 34.0
wall_margin_release_m = 60.0
wall_margin_floor_m   = 14.0

# Attitude caps [deg]. dive is the steep pit plunge (dive mode only); run is the
# in-bore tracking cap (the steep Murray ascent needs it); transit the cruise to
# the mouth; bank the roll ceiling. aoa_protect is always on in the bore.
dive_gamma_cap_deg    = 55.0
run_gamma_cap_deg     = 44.0
transit_gamma_cap_deg = 30.0
bank_cap_deg          = 65.0

# ---------------------------------------------------------------------------
# RUNG E17 — THE ARENA SPIRAL (Chad's tape 10, 2026-08-24: "they died in the
# tunnel run") — plus the RUN's own bail underneath it.
# ---------------------------------------------------------------------------
# THREE of his four AI tunnel runs ended in a wreck, all three at the SAME
# radius (11240 / 11224 / 11239 m) at lateral points kilometres apart, while
# the fourth threaded the bore cleanly and Chad himself flew 440 m DEEPER than
# any of them and lived. Decoded in test/unit/test_tunnel_track_probe.cpp
# (tag [.e17track]) against the shipped net and the real DEM:
#
#   the bore bottoms at R=13305 (1800 m below terrain); the SURVIVOR bottomed
#   at 13302 with sd in a tight -65..-290 m band and arc rising 0 -> 1.000.
#   The three that died opened identically, then at arc 0.46-0.55 — where the
#   bore crosses the ARENA — the walls fell away (sd -1000, -2000, -2400 m).
#
# ★ AND THE VERTICAL CHANNEL WAS COMMANDING A FULL +44.1 deg CLIMB, PINNED AT
#   THE CAP, THE ENTIRE WAY DOWN (alt_err +755 -> +1719 m below the centreline
#   on track 7A; +1018 -> +2063 on 2A). They were told to climb, at maximum,
#   and sank two kilometres. That is a SPIRAL: 1-2 km off the centreline
#   saturates the BANK too, and a pinned bank plus a pinned climb demand does
#   not climb — it tightens the spiral into the room's floor.
#
# run_recover_alt_m: past this much vertical error, start handing the lift back
#   to the VERTICAL by shrinking the bank cap (blended out to 2x this). 300 m
#   is well outside the +/-80 m band a healthy run holds (measured above) and
#   well inside the 755 m the first wrecked sample was already at.
# run_recover_bank_cap_deg: the cap under full recovery demand. 25 deg still
#   tracks the bore axis; the rest of the lift goes up. Loader-checked <= the
#   normal cap so a "recovery" can never become a bank repeal.
# run_stall_s / run_stall_arc_m: the FLOOR, not the cure. RUN is the only
#   tunnel mode with no bail — TRANSIT has a budget, DIVE_IN 25 s, CLIMB_OUT
#   40 s — and both its exits are functions of the arc estimate alone, so a
#   lost centreline makes RUN permanent. A run that has not made 150 m of arc
#   in 8 s has lost the bore: break off UP instead of pressing a dead run.
# All four are 0-OFF (0.0 on the two _m/_s dials) = the pre-E17 machine,
# bit-for-bit. ⚠ FLIGHT-BEHAVIOUR CHANGE HE HAS NOT FLOWN.
run_recover_alt_m        = 300.0
run_recover_bank_cap_deg = 25.0
run_stall_s              = 8.0
run_stall_arc_m          = 150.0

# Autopilot gains (snappy, combat-class) + the pursuit steering gains.
bank_p = 0.5    # roll P-gain (reach the commanded bank fast)
pitch_p = 2.2   # pitch P-gain
k_az = 3.5      # bank command per rad of horizontal bearing error to the route
k_el = 3.0      # gamma command per rad of elevation error to the route

# exit_frac: the fraction of the bore the RUN threads before handing to CLIMB_OUT.
# CLIMB_OUT continues the SAME wall-guarded slope-feedforward law (with the
# virtual centreline extension out of the mouth), so it threads the steep exit
# ascent and breaks CLEAN out to the surface — the run hands off late.
exit_frac = 0.95

# period_scale stretches every pilot's between-run gap (bigger = rarer runs).
# engage_aggression_min: a maverick loitering in PATROL still hunts the player if
# its trait aggression is >= this (a committed run always ignores engagement).
period_scale         = 1.0
engage_aggression_min = 0.55

# RUNG E2.1 FIX — THE FINAL-LEG GRACE [s]. The TRANSIT give-up budget
# (transit_timeout_s, 150 s) is ONE clock spanning both stages of the
# two-waypoint approach, and it was MEASURED too small for the pattern: in the
# game-loop certificate Stage A (the dash to the FIX, 6.85 km behind the mouth)
# cost 105-135 s of the 150, and the fleet then died ON THE LINE, aligned
# (cross-track 42-320 m, align 0.97-0.99), 0.5-4 km short of the arm gate. 11
# of 12 give-ups in a 10-minute window were that shape; ONE pilot in the whole
# fleet ever crossed the arm point. Reaching the FIX now buys this much more
# clock, ONCE per transit (a go-around does not re-buy it), so the total stays
# hard-bounded at 150 + this and the anti-livelock guarantee is unchanged.
# 90 s is the MEASURED value: the final leg is transit_fix_back_m 6000 m at
# climb_speed_min 118 m/s = 51 s, plus the fix U-turn and the line capture.
# 0 = off, bit-identical to the pre-fix machine.
transit_fix_grace_s  = 90.0
#
# ★★★ RUNG E15 — STAGE A'S BUDGET SCALES WITH THE DISTANCE IT HAS TO FLY.
# CHAD'S FLY REPORT ON TAPE 9 (2026-08-24): "they didnt attack underground
# however, are there any being allocated to the underground??"
#
# THEY WERE. The enemy launched TEN runs and arrived ONCE. Eight died in
# TRANSIT, and three of those ended at EXACTLY 150.0-150.2 s — the raw
# transit_timeout_s — meaning they never captured the FIX and never earned the
# 90 s grace above. A Stage A failure. They launched 9.5-22.0 km from their
# approach point (the FIX sits a further 6 km + approach_back_m behind it), and
# the MEASURED effective closure in transit is 91.5 m/s for the enemy and
# 102.3 for the allies — not the 143 m/s airspeed, because of the FIX dogleg.
# So a 16 km launch needs ~175 s of Stage A and a 22 km launch ~240 s, and a
# FIXED 150 s IS A RANGE LIMIT WEARING A TIMEOUT'S CLOTHES: anything ordered
# past ~15 km is dead on launch and nothing checks it.
#
# ★ THE ASYMMETRY THAT LOOKED LIKE A MAP PROBLEM ISN'T ONE: the enemy's
# approach point sits 12.4 km from its dome centre against the ally's 15.1 km
# — the geometry FAVOURS the enemy. His allies simply launched closer, and
# converted 38-50% against the enemy's 0-11%.
#
# 11.0 = 1000 / 91.5 m/s, the SLOWER of the two measured closures, so the
# budget is sized on the arm that was failing. Anti-livelock survives by
# construction: the distance is measured once at entry and is bounded by the
# planet, so the budget is finite for every reachable geometry.
# 0 = OFF = the flat timeout, bit-identical.
#
# ★★★ IT SHIPS OFF, AND THE MEASUREMENT IS WHY. The mechanism above is correct
# and tested — a fixed 150 s IS a hidden range limit — but it cannot be paid
# for at today's crash rate. Probe P-H, same replay, only this dial moving:
#
#   s_per_km   his pumps        first lost   ENEMY CRASHES/min (he signed 0.94)
#      0.0     surface 0, deep 18%   16.5 min        1.65
#      3.0     BOTH down              7.2 min        4.60
#      6.0     BOTH down              7.2 min        4.60
#     11.0     BOTH down              7.2 min        4.60
#
# ★ 3.0, 6.0 and 11.0 are IDENTICAL to the digit: past ~3 s/km no transit ends
# on the timeout any more, so more rope is inert. The whole effect is the first
# step — and that step nearly TRIPLES the crash count.
# ★ THE REASON IS A DEFECT THIS RUNG DOES NOT FIX. TRANSIT is leash-EXEMPT, so
# a striker crossing to the mouth is outside its own dome, in thin air, where
# lift lapses (rho * atm_frac, unfloored) and is not floored the way torque is.
# Tape 8's forensics put 14 of 22 AI crashes outside the dome. More rope for the
# tunnel is, mechanically, more time in the place they die.
# ★★★ SO THE LADDER RE-ORDERED: THE BUBBLE-EXIT / VACUUM CRASH DEFECT BLOCKED
# THE TUNNEL RUNG. ★ RUNG E16 PAID IT (game.toml deck_terrain_relative): the
# corridor now has a breathable lane, so the rope no longer buys wrecks. Probe
# P-H, same replay, this dial at 11.0:
#     old sphere deck   103 crashes  (4.60/min)   <- the wall this rung hit
#     terrain deck       20 crashes  (0.89/min)   <- under Chad's signed 0.94
# THIS IS THE ONE EDIT THE PREVIOUS SESSION LEFT READY. Walk-back: 0.0.
transit_reach_s_per_km = 11.0

[gunsight]
# Lead-angle pipper (Chad: "calculate the lead angle for a hit"). A READ-ONLY
# deflection solution — no shot is fired. The pipper marks where to point the
# nose to hit the nearest bandit ahead; it turns green when the nose is on the
# solution AND the bandit is within range.
muzzle_speed  = 805.0  # [m/s] hub cannon (MG151/20 M-Geschoss) muzzle speed — the aiming reference
# drag_k is NOT in this file. It is single-sourced from world.toml [guns]
# cannon_drag_k_per_m and threaded into GunsightParams by load_scenario_toml
# (FIX 5, Fable: eliminates the silent-fork risk of two independent copies
# that can drift). See config/load_scenario.h for the contract.
hit_cone_deg  = 2.0    # [deg] nose-on-solution cone that counts as "on target"
max_range     = 500.0  # [m] effective gun range (green only inside this)
track_range   = 2000.0 # [m] engagement range: pipper shows + TOT% runs inside
                       #   this. The TOT denominator only counts within max_range
                       #   (a real shot), so the % means "in-gun-range on-target".
track_cone_deg = 45.0  # [deg] engagement half-angle off the nose: a bandit
                       #   further off boresight than this is not "engaged" (no
                       #   pipper, no denominator) — it's not a shot you can take.

[combat]
# Bandit COMBAT AI (docs/bandit_combat_plan.md): the patrol drones become
# ATTACKERS — they seek the player out in a merge and shoot back, and the player
# can be shot down. "Good but not that good", all tuneable here (no recompile).
# NOTHING here touches the flight kernel (the firewall): bandit AI reads the
# player read-only; enemy rounds + player HP live in world/combat state; player
# death reuses the crash-respawn path.

# The MASTER knob. An int level 1..5 -> how many bandits hunt at once, how fast
# they shoot, and how hard each round bites (combat::difficulty_params). Raise
# for a harder fight. 1 = one slow, soft attacker; 3 = a fair fight (~6-7 solid
# hits to down you); 5 = several fast, hard bandits (a real furball).
difficulty = 4   # 3->4 (Chad fly 2026-07-14 "the others took off and I couldn't
                 #   catch them"): at 3 only 2 of the fleet hunt at once, so 8/10
                 #   just patrol straight away. 4 -> 3 attackers (busier merge),
                 #   with a harder burst/damage to match. Pair with the wider
                 #   engage_range below so distant bandits actually wheel in.

# Player stakes.
player_hp           = 100.0  # [HP] player health (> 0)
player_hit_radius_m = 9.0    # [m] swept-sphere radius enemy rounds test against
                             #   the player (true-scale, matches the drone radius)
respawn_invuln_time = 2.0    # [s] post-respawn invulnerability (anti spawn-camp)

# Bandit gun (a single forward 20 mm at the CG — enough threat for v1). rof + per-
# hit damage come from `difficulty` (the level owns the threat scaling); only the
# ballistics live here.
bandit_muzzle_speed = 600.0    # [m/s] slower than the player cannon (805) — the
                               #   bandit is deliberately a lesser shot
bandit_drag_k       = 0.0008   # [1/m] quadratic drag (matches the cannon proxy)
bandit_convergence  = 250.0    # [m] gun harmonisation range (>= 50 m floor)

# Engagement selection (which bandits become attackers). Hysteretic: a bandit
# starts hunting inside engage_range and keeps hunting until it exceeds
# disengage_range (the gap stops the attacker set chattering at the boundary).
engage_range    = 6000.0  # [m] a bandit within this can be flagged an attacker.
                          #   3200->6000 (Chad fly 2026-07-14 "couldn't catch
                          #   them"): at 3.2 km a patroller pointed away is a long
                          #   stern chase (~82 m/s closure); 6 km lets bandits
                          #   notice and wheel toward you sooner — a merge, not a
                          #   tail chase.
disengage_range = 7000.0  # [m] an attacker keeps hunting until it exceeds this
                          #   (must be > engage_range; tracks engage_range up)

# Pursuit steering (how aggressively an attacker fights for a firing solution).
# These steer the SAME PD autopilot, which now has a SOFT AoA LIMITER (drone.h
# autopilot, aoa_protect): the pursuit can pull HARD for a tight reversal, but the
# limiter fades the into-stall pitch so the bandit can no longer depart into the
# porpoising fall Chad saw 2026-07-14 ("one fell on its own"). So the aggressive
# gains below stay (they give the fast nose-swing that brings guns to bear — the
# "they just fly away" fix); the limiter is the safety net, not a speed brake.
# Probe: 2.2 + 20 deg WITHOUT the limiter porpoised through ~72 deg AoA; WITH it,
# AoA is capped ~25 deg and altitude holds. Raise gains/pull for a nastier
# dogfighter; lower to relax (the limiter keeps any setting stall-safe).
pursue_k_az          = 5.0   # bank command per rad of horizontal bearing error.
                             #   3.0->5.0 (furball repro fix, 2026-07-26): at
                             #   real 20-30 km spawn range against a genuinely
                             #   maneuvering (turning) player, 3.0 let a subset
                             #   of the fleet settle into a matched-rotation
                             #   orbit (bearing-off angle oscillating 55-146
                             #   deg for the whole 120 s engagement, never
                             #   closing) instead of cutting the corner onto an
                             #   intercept — a harder bank-to-turn command
                             #   breaks that limit cycle (measured: every
                             #   fleet member's CLOSEST approach over 120 s
                             #   drops well below its spawn range, vs 2/10
                             #   stuck orbiting at range before).
pursue_k_el          = 2.5   # climb/dive command per rad of elevation error
pursue_max_bank_deg  = 55.0  # [deg] steepest pursuit bank. REVERTED 65->55
                             #   (2026-07-26 gate fix): 55 deg is the
                             #   documented stall-safety ceiling (the drone
                             #   autopilot has no G-protection; above ~55 deg
                             #   at pursuit q it risks departure) and the
                             #   loader enforces it. More bank does not even
                             #   help pointing at high V (turn rate = g*tan
                             #   (bank)/V — V dominates); the pointing fix
                             #   lives in pursue_pull_deg (the nose-swing pull,
                             #   below) within this safety ceiling.
pursue_max_gamma_deg = 30.0  # [deg] steepest climb/dive / pull toward the player
pursue_bank_gain     = 0.45  # combat ROLL gain (patrol is 0.15): reach bank ~2 s
                             #   without the over-gained hunt that spoils a solution
pursue_pitch_gain    = 2.2   # combat PITCH gain (patrol is 1.6)
# RUNG E7.4 — THE ENGAGED-TRACKING PITCH GAIN (0 = off = pursue_pitch_gain
# everywhere, bit-for-bit). MEASURED (docs/ENEMY_AI_E1_E2_SPEC.md "E7.E"): at
# 2.2 the pitch channel LIMIT-CYCLES while tracking. In a steady 55-deg turn
# with a level gamma command the airframe swings its flight path 14 deg
# peak-to-peak and pulls n = 5.5 to hold a turn needing 1.74 — about 4 G going
# into pitch thrash instead of turn. The cycle collapses between 1.8 and 1.4;
# past it the net turn rate is HIGHER (2.84 vs 2.39 deg/s) on the same bank and
# the aeroplane keeps 4 m/s more speed. A nose thrashing 14 deg vertically is
# what a gun solution cannot survive, and is also what Chad saw as "elevator
# dipping up and down".
# ★ SCOPE: consumed at the two ENGAGED pursue/BFM seams only. The
# terrain-avoidance PULL-UP and the raid/defend/leash errands keep
# pursue_pitch_gain — lowering their gain would slow every pull-up (CFIT).
# Proven bit-for-bit, three ways, by "E7.4: the tracking gain never touches the
# errand or pull-up paths" (mutation-verified: leaking the dial into either the
# avoid branch or the raid errand turns that leg red).
# ★★ THE VALUE (rung E7.4, 2026-08-22; the fine sweep is spec §E9.1). The
# cliff is between 1.7 and 1.4 and the ruler is THE GUN'S OWN CONE: the limit
# cycle must not eat more than half of fire_cone_deg (14) before any tracking
# error, lead error or LOS rate is spent. Peak-to-peak flight-path swing at
# 30 deg bearing: 2.2 -> 14.07, 1.7 -> 10.61, 1.6 -> 7.38 (still over the 7.0
# bar), 1.5 -> 4.20, 1.4 -> 2.86. 1.5 is the first value inside the bar, and it
# is ALSO the peak of net turn rate on the nose (2.87 deg/s against 2.21 at
# 2.2) and of retained speed — the porpoise was EATING the turn it was
# supposedly buying. The named cost is OFF the nose, where there is no cycle to
# cure and the over-pull was doing real turning work: abeam (90 deg) the base
# tier loses 22.0 -> 18.0 deg/s and keeps ~2 m/s more speed, and the ace tier
# loses 27.8 -> 26.2 while no longer DIVING 290 m to get it. Chad's stick rules
# that trade. Walk-back is one line: 0.0.
pursue_track_pitch_gain = 1.5
pursue_pull_deg      = 45.0  # [deg] extra nose-up PULL blended in when hard-banked
                             #   FAR off the nose — tightens the reversal, then eases
                             #   to 0 inside ~30 deg so it settles its guns onto you.
                             #   20->45 (2026-07-26 gate fix, "close AND point"):
                             #   at pursuit speed (85+bump, at/near player cruise)
                             #   and the 55 deg bank ceiling, a pure bank-to-turn
                             #   is too shallow to reverse onto a target fleeing
                             #   dead astern within a real engagement window (a
                             #   check-six reversal is a combined roll+pull
                             #   maneuver, not a flat turn) — more pull swings the
                             #   nose through the reversal without touching bank
                             #   or speed. Verified: the fleeing-player nose-on
                             #   test now swings from -0.98 to +0.65 in 20 s
                             #   (was capped at +0.18, never crossing the +0.3
                             #   "guns can bear" bar) with the same speed/bank.

# Deflection LEAD: an attacker aims where you WILL be (range / this speed ahead)
# so a boresight burst connects on a crossing target instead of trailing it. Set
# ~= bandit_muzzle_speed. LOWER it to make them miss more (worse shots); 0 = pure
# boresight (they'll almost never hit a maneuvering player).
pursue_lead_speed = 600.0  # [m/s] reference round speed for the lead solution

# Lead-time cap (furball repro fix, 2026-07-26): pursue()'s STEERING reuses the
# gunnery lead point at ANY range — at a real furball's 20-30 km spawn
# distance the uncapped lead extrapolates the player's (turning) velocity 30+
# seconds ahead, sending several bandits chasing a phantom position instead of
# the real one ("meanders from 25 km"). Capping keeps the FIRING solution
# exact (fire_range_max is always well under the cap) while bounding the
# long-range steering lead to a sane gunnery-scale extrapolation.
pursue_lead_max_s = 8.5  # [s] cap on t_lead = range / pursue_lead_speed

# Return fire gate (when an attacker actually shoots). It fires only when its
# (leading) aim is inside this nose-on cone AND the player is in the range band.
# game-AI-R4 (Chad's order 2026-08-05: "I ordered for ai that can kill me"):
# 5.0 -> 14.0. The 5-deg sniper cone was nearly unholdable against a
# maneuvering human — the bandits merged and never got rounds off (his fly
# report). 14 deg turns a rough saddle into a real BURST with spray; KE
# falloff + ballistics still make most rounds miss, so it reads as pressure,
# not an aimbot. Chad's dial — walk back toward 8-10 if it feels unfair.
fire_cone_deg  = 14.0   # [deg] nose-on cone the bandit fires within
fire_range_min = 60.0   # [m] no shot closer than this (keeps rounds off a merge)
# RUNG E1.2 (docs/ENEMY_AI_E1_E2_SPEC.md): 600 -> 900. Measured over tapes
# 83-88 (~81 min): 22 enemy rounds TOTAL, 9 aimed at the player, 2 hits. The
# fire band [60, 600] intersected with the 1200 m merge handover and the 2 s
# dwell latch left guns_hot-AND-in-band at 0.63 s per 90 s of fight. 900 is
# still inside the bandit gun's useful KE envelope and is the same ceiling the
# snapshot band uses, so no round can ever be spawned beyond it (pinned by the
# P-A probe as a REQUIREMENT, not a hope).
fire_range_max = 900.0  # [m] no shot beyond this (KE falloff makes it pointless)

# ---- RUNG E1: the kill chain (docs/ENEMY_AI_E1_E2_SPEC.md) ------------------
# Chad's order: "a truly formidable opponent that will attack and kill me."
# Every dial here has an OFF value that reproduces the pre-E1 fleet bit-for-bit
# (pinned by the knob-off differential legs in test_enemy_ai_e1.cpp).

# E1.2 THE SNAPSHOT GATE. Guns were hot ONLY in BFM Offensive, so the head-ons
# and crossing merges an ace actually grants went unshot because the machine
# happened to be in Intercept/Yoyo/Extend at that instant. The snapshot gate
# runs the SAME fire discipline (ballistic solution in the 14-deg cone,
# coordinated, in band) independent of BFM mode. It fires at DRONE foes too, so
# AI-vs-AI round volume rises. 0 = off.
snapshot_range_m = 900.0  # [m] snapshot band ceiling (== fire_range_max)

# E1.1 AUTOTHROTTLE DEFICIT FEEDFORWARD (spec P0-2 fold). The bare P
# autothrottle (0.40 + 0.02*err) only reaches full power at a 30 m/s error, so
# a commanded 265 settles ~235-240 — below the player's 259 mean, i.e. the
# COMMANDED ceiling was never the ACHIEVED speed. This adds throttle per m/s of
# DEFICIT only (identically zero at/above the setpoint, so it can never
# overshoot the command). 0.08 saturates the throttle within ~6 m/s of the
# setpoint instead of 30. 0 = off.
throttle_ff = 0.08  # [throttle per m/s of speed deficit]

# E1.4 GRACE — the bank-rate slew. pursue_k_az 5.0 saturates the 55-deg bank
# cap at 11 deg of bearing error, so the roll command has always been bang-bang
# (there is no bank-rate limit anywhere in the fleet) and a gun solution never
# settles. Applied at ONE final seam in drone::tick, AFTER the terrain-avoid
# clamp, so pursue/BFM/maverick/raid/defend/strike all inherit it. 0 = off.
#
# ! 240, NOT the spec's suggested ~90 — MEASURED (probe P-A, 80-minute
#   ensembles). A command rate limit must stay FASTER than the plant's own roll
#   response or it becomes the dominant lag instead of smoothing the command:
#   the autopilot reaches a commanded bank in ~1-2 s at pursue_bank_gain 0.45,
#   and 90 deg/s spends 1.2 s just crossing the +/-55 deg envelope — the same
#   order. Measured at 90: ZERO hits on the player across every blend length
#   tried (4 of 4 arms). At 240 a full +/-55 deg reversal is commanded in
#   0.46 s — still a real rate limit on the bang-bang command, comfortably
#   inside the roll loop's own response — and the probe scored 39 rounds /
#   18 hits over the same 80 minutes. Chad's dial.
bank_slew_dps = 240.0  # [deg/s] max commanded-bank rate

# Pursuit speed bump (Chad's "MAKE THEM GOOD", 2026-07-26): added to `speed`
# above as the autothrottle setpoint ONLY while actively pursuing (patrol
# cruise is untouched) so a chasing bandit can actually close/threaten in a
# merge, not just win on a lucky turn. Kept modest — speed + this stays well
# under the player's own redline (245), so a straight-line run still escapes
# (the fight stays beatable).
# 25.0->90.0 (furball repro fix, 2026-07-26, "make them hunt me" / "spread out
# looking for me"): 85+25=110 m/s is SLOWER than the player's own cruise
# (~167) — a pursuer can never close a tail chase at all if it is slower than
# the target it is chasing, no matter how good the steering is (measured at
# the real 20-30 km furball spawn distance: mean fleet range barely moved in
# 120 s at the old bump). 85+90=175 clears cruise with margin while staying
# well under the player's redline (245) — the player can still out-run a
# chase at full throttle, "the fight stays beatable" holds.
pursue_speed_bump = 90.0  # [m/s]

# Pursuit climb-throttle feedforward (furball repro fix, 2026-07-26): without
# this, a sustained pursuit pull/climb (target_gamma > 0) has no energy
# management — the plain cruise autothrottle is blind to gamma, so a hard-
# chasing bandit quietly BLEEDS altitude over the engagement and repeatedly
# trips its own terrain-avoidance latch (the forced pull-up then steals the
# pursuit bank/gamma for its duration) — measured as the dominant reason a
# furball fleet reads as "wandering"/"stuck outside the bubble" rather than
# closing. Same shape as the maverick brain's climb_throttle_gain
# (drone/maverick.h): throttle_ff += this * sin(target_gamma). 0 = the old
# no-op behavior.
pursue_climb_throttle_gain = 1.3  # throttle ff weight on sin(target_gamma)

# AI self-preservation (Chad's "MAKE THEM GOOD": no flying off sky-high to
# mush in thin air, no augering into the terrain maneuvering low). Both
# guards run for every non-tunnel disposition (patrol, pursuit, raid); a
# committed maverick tunnel run is exempt (its own wall-guard/climb-out law
# owns collision there).
# Hard-deck / terrain avoidance: hysteretic (release strictly above enter).
avoid_agl_enter_m   = 250.0  # [m] AGL: engage the forced pull-up below this
avoid_agl_release_m = 400.0  # [m] AGL: release only above this
avoid_lookahead_s   = 3.0    # [s] sink-rate look-ahead: a steep dive engages
                             #   the pull-up before it is already below the floor
# ★★★ RUNG E11 -- THE AIR-SEEK DIVE FADES WITH THE RUNWAY (0 = off).
# Chad's tape 6: 21 AI terrain crashes in 14 min, and the rate 2.5x-ed the
# moment the bubbles shrank (0.98/min before the first pump death, 2.50/min
# after). The air-seek dive drives a starved drone DOWN to find breathable air;
# it dives to redline, control authority compresses to min_frac 0.4 there, and
# the pull-up -- measured ARMED on 100% of wrecks -- cannot rotate in the
# runway left. The seek's own comment claimed the downstream terrain-avoid
# "overrides everything, so seeking air can never fly anyone into the ground".
# The override fires; the recovery does not. There is no air below the ground.
# ⚠ HONESTY: this value is NOT confirmed by the harness. P-A never kills a
# pump, so its bubbles never shrink, so the air-seek never fires there -- the
# only fixture available is structurally blind to this defect (it read
# 3/4/3/3 crashes across the whole sweep). It ships because E11's OWN bubble
# collapse creates the starved condition deliberately, and because the geometry
# is not a guess: the seek must be gone by the altitude the pull-up releases at.
# Confirming it needs a conquest fixture that actually kills pumps. Walk-back: 0.
avoid_air_dive_agl_m = 1500.0  # [m] AGL: full seek above, zero at the release
avoid_gamma_deg     = 26.0   # [deg] forced climb angle while engaged; overrides
                             #   pursuit/raid/leash entirely
avoid_bank_cap_deg  = 45.0   # [deg] bank clamp while engaged (near-level wings
                             #   so the pull-up is mostly vertical). 20->45
                             #   (2026-07-26 gate fix): at the REAL 20-30 km
                             #   furball spawn range a chasing bandit can need
                             #   a genuinely steep sustained dive (the
                             #   straight-line chord to a target 90+ deg around
                             #   this small planet's own curvature dips well
                             #   below the local horizon even at matched
                             #   altitude) that saturates pursue_max_gamma and
                             #   repeatedly trips this hysteretic guard over
                             #   flat ground; a 20 deg bank clamp during each
                             #   pull-up killed ~40% of its turn authority and
                             #   one fleet member never closed at all (stuck
                             #   oscillating). 45 deg keeps the pull-up mostly
                             #   vertical (still << pursue_max_bank) while
                             #   letting the bandit keep TURNING toward the
                             #   target through the pull-up instead of
                             #   stalling its intercept.

# ★★★ RUNG S1-DECK — DECK COMPETENCE. Chad, 2026-08-26: "they need to fly low
# on the deck and not crash in the low air zones. And we need to fix this
# persistent problem I have brought up over and over again to no avail."
#
# THE DEFECT, IN FOUR SHIPPED NUMBERS. Outside the domes the ONLY breathable
# air is the global deck: FULL air below game.toml deck_agl_m = 120 m AGL,
# faded to ZERO by deck_agl_m + deck_soft_m = 320 m (sim/aero.h:88-92). The
# terrain-avoid latch above engages below 250 m and RELEASES only above 400 m.
# THE TWO BANDS ARE DISJOINT: every altitude the pull-up will let go at is dead
# air. Deck flight outside a dome is therefore a forced limit cycle -- climb
# (guns muted) into vacuum, mush, sink, re-latch -- and it eventually loses the
# cycle into a ridge. Across tapes 7-11, 68 of 104 deaths (65%) were terrain,
# and TRANSIT -- ordinary cross-country deck flight -- was the single biggest
# mode at 27.
#
# THE BAND. 60 / 110 m. The release MUST sit at or below game.toml deck_agl_m
# (120) so the forced climb COMPLETES in full air -- that is the whole defect,
# and a gate leg loads BOTH configs and asserts it so it is structurally
# unrepresentable from now on. 60 leaves a 50 m hysteresis gap (the house rule)
# and 60 m of runway under the 100 m hold altitude.
deck_avoid_agl_enter_m   = 60.0   # [m] AGL: engage, in deck scope. ★ 0 = THE
                                  #   WHOLE-FEATURE WALK-BACK, bit-for-bit.
deck_avoid_agl_release_m = 110.0  # [m] AGL: release, in deck scope
# WHICH BAND AM I IN? Probe the air at the SHIPPED release altitude (400 m)
# over my own ground point: "the 400 m release has no air HERE" is not a proxy
# for the defect, it IS the defect. Hysteretic: enter below avoid_air_frac_full
# minus this, release above avoid_air_frac_full. Inside a dome the probe reads
# full air, so deck scope is FALSE and the in-bubble 250/400 band -- and the
# signed 412 m raid floor that rests on it -- do not move.
deck_scope_hyst_frac = 0.1
# THE TRACK LAW. bore_track's shape (unity feed-forward on the path the terrain
# ahead demands + a small altitude residual), carried from the bore to the
# surface. It replaces maverick::aim_at's saturated chord-dive on ERRAND legs
# only (transit / defend / raid / patrol); an ENGAGED tick is never overridden
# -- Chad ruled pursuit unlimited, "chase you anywhere", and BFM owns the nose.
# ⚠ RUNG DF-1 NARROWED THAT RULING ON 2026-08-31: BFM still owns the nose in the
# HORIZONTAL on an engaged deck tick, but no longer in the VERTICAL. See
# deck_fight_climb_cap_deg below.
# 100 m sits inside [release 110, the 120 m full-air lid]; the gain is
# bore_track's own proven track_gain.
deck_track_agl_m      = 100.0   # [m] AGL to hold on the deck
deck_track_gain       = 0.0045  # [rad/m] altitude residual
deck_track_dive_cap_deg = 12.0  # [deg] descent cap on the track law (the climb
                                #   side reuses avoid_gamma_deg)
deck_lookahead_s      = 12.0    # [s] forward terrain window; the samples are
                                #   FRACTIONS of it, so their METRES scale with
                                #   airspeed with no second dial

# ★★★ RUNG DF-1 — THE DECK FIGHT [deg]. CHAD'S RULING 2026-08-31, off tape 17:
# "their habit of pulling up when I'm near sets them into the no air spin zone,
# when fighting on the deck they should only be performing low altitude bank
# turning without a climb vector because it sends them flying out of the fight."
# His last two kills of that match were snap shots on aeroplanes already out of
# control from exactly this.
#
# 0.0 IS HIS WORDS LITERALLY: no climb vector. It is a REAL cap, not an off
# value -- NEGATIVE is off (and bit-identical), because a 0-valued dial that
# also meant "disabled" would make the shipped setting unrepresentable.
#
# ⚠ IT CAPS THE ELEVATION CHANNEL ONLY. Bank is not read at this seam, so the
# turn is exactly as hard as it is today -- this is the difference between a
# flat turning fight and a vertical one, not between fighting and not.
# ⚠ DESCENT IS NEVER RESTRICTED (a MIN), and the terrain-avoid pull-up runs
# AFTER it and overrides everything: pulling up still always wins, so rising
# terrain is answered by the safety law rather than by the pursuit.
#
# MEASURED (tape 17, enemy, deck scope + engaged, n=6,340): climb > 2.9 deg on
# 11.4% of ticks, 15.8% with the PLAYER as foe, peak command +30 deg; only 18.4%
# of those were terrain-avoid, 81.6% were BFM. Air fraction p10 = 0.00 -- the
# climb ENDS in vacuum. 12 excursions above 500 m against a ~120 m lane.
#
# ★ WHY avoid_air_frac_full BELOW CANNOT DO THIS: it fades climb by the air
# fraction where the drone ALREADY IS. In the deck lane that is full air, so the
# fade is 1.0 and the climb passes unopposed; it bites only once the aeroplane is
# in the thin air. Reactive where this must be predictive.
deck_fight_climb_cap_deg = 0.0

# ---- ENV-2: THE AIR-ENVELOPE GOVERNOR -------------------------------------
# Chad's 2026-08-28 ruling: "go low around the edges of the bubble in case
# theirs shrinks ... if they are deep in bubble they can climb and get an energy
# advantage ... Safe flying on deck, energy fighting in the safe atmospheric
# zone, with an applied buffer for them to fight lower on the fringes."
#
# The altitude allowance A(d) as a function of E1's signed depth d into the
# nearest LIVE dome's air (drone/drone.h, env_allowance_m):
#
#   A(d) = max( min( env_edge_alt_m + env_slope*d,
#                    env_plateau_m  + env_slope*max(0, d - d_knee) ),
#              deck_track_agl_m )
#   d_knee = env_shrink_radius_frac * r_eff_BASE(bearing)
#
# It is a CLAMP: it only lowers a commanded climb. It never steers, never
# touches bank, never breaks off a chase. "Chase you anywhere" is untouched.
# env_edge_alt_m = 0.0 turns the whole governor off, bit-identical.
env_edge_alt_m        = 600.0   # [m AGL] ceiling AT the air edge (d = 0).
                                #   ★ CHAD RULED THE LOOSE PAIR 2026-08-29.
                                #   The tight pair (300 / tan 12 deg) matches
                                #   his own fringe flying, but at the measured
                                #   post-shrink portal geometry it leaves
                                #   253-317 m of cross error against
                                #   transit_line_tol_m = 300 -- i.e. it makes
                                #   the TUNNEL RAID ARMING marginal-to-dead,
                                #   and he praised those tunnel runs. The
                                #   fringe-feel question is still open on his
                                #   fly; the arming constraint is not.
env_slope             = 0.364   # [m/m] fringe ramp = tan(20 deg)
env_plateau_m         = 1650.0  # [m AGL] the shrink-survivable plateau.
                                #   Measured: survivable crossings run
                                #   +430..+920 and certain death flown level
                                #   starts about +1670, so this sits just under
                                #   the cliff ON PURPOSE and the arm stresses
                                #   exactly that seed.
env_desc_cap_deg      = 20.0    # [deg] descent authority once ABOVE A(d).
                                #   The shipped 12 deg track cap sheds ~850 m
                                #   in the ~24 s an airframe survives vacuum;
                                #   ally i=9 needed ~1800 and died WITH the
                                #   track law active. The player's own drill
                                #   is 18-25 deg sustained.
env_desc_fade_band_m  = 400.0   # [m] the cap opens 12 -> 20 deg linearly over
                                #   this band above the ceiling
env_fade_band_m       = 150.0   # [m] anti-porpoise: fade the allowed CLIMB out
                                #   over the last this-many metres below A(d)
env_shrink_radius_frac = 0.5    # ⚠ MIRRORS game.toml [conquest]
                                #   shrink_radius_frac. The plateau's whole
                                #   justification is "reach as far in as ONE
                                #   shrink can move the edge" (measured: 8,700 m
                                #   on the SUDBURY major axis, in a single
                                #   tick, stranding five aeroplanes at once).
                                #   ★ CHAD RULED THE KNEE CONSTANT 2026-08-29:
                                #   half the BASE radius whatever the dome's
                                #   current size. Declared cost, loudly: the
                                #   free energy core is 36% of the dome at
                                #   scale 1.25, 11% at 0.75, NONE at 0.5.
                                #   An E2 arm pins this equal to game.toml's.

# ---- ENV-3: THE DEFENCE SCRAMBLE --------------------------------------------
# Chad, 2026-08-28: "when triggered to defend may climb and then use the dive
# (parabolic) to get to enemy me faster if I am attacking their pump or they
# mine." Ruled 2026-08-29: DIVE-IF-HIGH / SPRINT-IF-LOW -- the literal
# climb-then-dive from low costs ~13 s (55 s vs 42 s at 9 km) and is not taken.
# MEASURED PROBLEM: time-to-first-defender-within-900-m of the dying surface
# pump on tape 13 was INFINITE; the closest any SUDBURY drone came while pump 1
# died was 3,679 m. The scramble had been inheriting raid_speed_target = 123,
# an ORBIT dial nobody chose for a 9 km emergency.
# 0 = OFF = the inherited orbit speed, bit-identical.
defend_sprint_speed   = 245.0   # [m/s] scramble transit speed.
                                #   ⚠ This IS v_redline (aircraft.toml). Past
                                #   it the compression ramp strips control
                                #   authority -- hence the release below.
defend_release_m      = 2500.0  # [m] release to the orbit speed for the merge;
                                #   the turn radius at redline cannot close the
                                #   on-station envelope (C1's lesson)
# ★★★ CHAD'S DOCTRINE, RULED 2026-08-30 -- THE PARABOLA IS A ONE-SHOT.
# His words, and this is the SPEC for the manoeuvre, not a one-time setting:
# the dive ARMS ONCE (high AND far), is RIDDEN, and EXITS on a gate (speed
# reached, or range to target) INTO THE MERGE. ⚠⚠ IT IS NEVER A PER-TICK FLOOR.
# ★ WHY THE DOCTRINE EXISTS. The first build was a sustained floor -- at least
# 18 deg down on EVERY tick a defender was high and far, ending only at pump
# altitude with its energy spent and no merge in reach. RE-MEASURED AT HEAD
# 2026-08-30 (post-perch, post-merge) at 18 deg: the SIGNED game-loop
# certificate's clause B (AI-vs-AI attrition, test_maverick.cpp) read
# `ai_damage` EXACTLY 0, on 106,226 defend orders and 69,606 enemy-on-player
# samples. The air war did not degrade, it STOPPED. His ruling was never the
# defect; the build was. A parabola is a one-shot.
# ★ The player's own sustained stranding-recovery angle is 18 deg; his ruled
# defensive parabola was flown at -30/-35 deg.
defend_dive_gamma_deg = 18.0    # [deg] the far leg of the ride
defend_dive_close_gamma_deg = 30.0  # [deg] steepened inside the close range
defend_dive_close_range_m   = 4000.0  # [m] where it steepens
defend_dive_arm_alt_m  = 400.0  # [m] height advantage over the defended pump
                                #   required to ARM. This is the "high" half of
                                #   "high AND far" -- below it a defender is not
                                #   trading altitude for anything and the
                                #   measurement says the manoeuvre costs it 13 s.
                                #   0 = arm on any advantage at all.
defend_dive_exit_speed = 150.0    # [m/s] EXIT the ride once the dive has bought
                                #   this much speed -- that IS the manoeuvre's
                                #   purpose, and the point of the exit is that
                                #   what follows is the MERGE, not more diving.
                                #   ⚠ 245 is v_redline (aircraft.toml): past it
                                #   the compression ramp strips control
                                #   authority, so buying more speed than this
                                #   buys nothing a defender can spend.
                                #   0 = no speed gate, range gate only.

# ---- ENV-3.4: THE PERCH -----------------------------------------------------
# Chad, 2026-08-28: "if they are deep in bubble they can climb and get an energy
# advantage to be more effective defenders and attackers, MAKE SURE THAT ABILITY
# PERSISTS." ENV-2 gives PERMISSION to be high deep inside; nothing made them
# TAKE it, because the allowance is a ceiling and never a target. This is the
# separate, explicit thing that converts permission into posture.
# MEASURED on Chad's signed fly (tape 14): median altitude by depth band was
# outside 347 m / fringe 904 / plateau 1,547 / free core 1,783, p90 2,004,
# max 2,236 -- so in the core they stop a few hundred metres below what the
# envelope already allows. That headroom is what this takes.
# ⚠ Gamma only -- bank is never touched, so a patrol keeps its geometry and the
# wing does not converge on a point. It fires ONLY in the order-free,
# non-engaged, non-tunnel arm of the errand chain.
# 0 = OFF = bit-identical.
guard_alt_lo_m        = 1500.0  # [m AGL] floor of the perch band
guard_alt_hi_m        = 2500.0  # [m AGL] ceiling of the perch band
guard_margin_m        = 300.0   # [m] stay this far UNDER the ENV-2 allowance,
                                #   so the perch is never the thing the
                                #   governor has to clamp (that would chatter)
guard_climb_gain      = 0.0008  # [rad/m] gentle proportional climb; fades to
                                #   zero AT the perch, which is what removes the
                                #   need for a latch
guard_gamma_cap_deg   = 7.0     # [deg] cap on the perch climb -- a posture, not
                                #   a zoom
# THE FORWARD EYES' CAPABILITY MODEL. The shipped avoid_lookahead_s subtracts
# SINK RATE from the AGL and is structurally blind to a ridge FACE ahead of a
# LEVEL aeroplane -- which is why raising it 3 -> 9 s moved the crash count
# 3/3/4/3. This is the net perpendicular g used to derive the flight-path
# rotation TIME from the live speed and flight-path angle. 0 = the forward
# arming is OFF (the band and the track law still ship).
#
# ★ 3.0 IS MEASURED, NOT ASSUMED. Probe [.deckx] instruments the ACTUAL net
# perpendicular g of a latched pull-up, V*(dgamma/dt)/9.81 across consecutive
# latched ticks, over a whole 22-minute conquest match on the real DEM:
#     shipped-before arm  p10 0.84  p50 5.00  p90 11.68  max 25.77 (n=76750)
#     deck-band arm       p10 1.53  p50 6.53  p90 12.70  max 19.49 (n=42568)
# 3.0 sits BELOW both medians on purpose: the model under-claims what the
# airframe demonstrably does, so the predicate arms EARLIER than strictly
# necessary. The design's proposed 1.0 was refused by the red team and by this
# arithmetic: at 1 g the rotation term alone is 85*0.45/9.81*85 = 331 m against
# a 127 m near sample, so ANY obstacle ahead latches, guns muted, permanently.
# At 3.0 the rotation term is 110 m and level deck flight never arms.
avoid_pull_net_g = 3.0
# Flyable-air ceiling: fades out further COMMANDED CLIMB as the local air
# thins (sim::atm_frac_at), so a pursuit can't keep climbing into vacuum
# above a bubble ceiling / off the global deck and mush. Full climb allowed
# at/above avoid_air_frac_full, zero further climb at/below avoid_air_frac_hard
# (descent is never restricted).
avoid_air_frac_full = 0.7
avoid_air_frac_hard = 0.25

# ---- BFM rung R1 (docs/bandit_bfm_r1_spec.md) -------------------------------
# The dwell-latched dogfight state machine (drone/bfm.h). With bfm_enabled=false
# an engaged bandit flies bare pure pursuit exactly as before (bit-identical --
# every dial below is DEAD while disabled). Turn it on and the bandit gets four
# committed modes instead: Intercept (run in), Offensive (pure->LAG pursuit
# blend, the only mode with guns hot), Yoyo (trade excess closure for altitude
# instead of overshooting), Extend (unload and rebuild energy when losing).
# Nothing here touches the flight kernel -- it only decides where the nose
# points; the SAME autopilot / autothrottle / soft AoA limiter fly the result.
# LIVE = true (the R1 fly ships armed -- the R5 fly-1 lesson: a fly that needs
# a config edit first is a fly that happens with the feature off). The STRUCT
# default stays false (bit-identical off-arm, pinned by test_bfm); false here
# is the kill-switch.
bfm_enabled = true

# Intercept <-> Offensive handover. attack_release_frac MUST be > 1: a single
# threshold would chatter every time the range rippled across it.
# FIX-F1 note (docs/ai_phase2_fix_spec.md): KEPT AT 1200. Opus's probe
# originally recommended 750 to land the guns-hot dwell inside the fire band
# (fire_range_max = 600), but with bfm_extend_energy_m fixed the Offensive
# spell is frustration-length (~8 s) and covers the closure into the band
# anyway — the probe re-run confirmed wants_fire opens at 1200, and 750
# broke the game-loop certificate's slow-target kill chain for no measured
# gain. Dial — Chad's stick if the felt merge range wants tuning.
# RUNG E1.2: 1200 -> 2200. The measured G2 phase gap — Offensive (the only
# guns-hot mode) armed at 1200 m, and with the 2 s dwell latch plus the [60,
# 600] fire band the machine held guns_hot IN BAND for 0.63 s per 90 s of
# fight. Arming the merge at 2200 m means the run-in COMPLETES inside Offensive
# and the closure into the (now 900 m) band happens with guns already hot.
bfm_attack_range_m      = 2200.0   # [m] inside this, the merge is on
bfm_attack_release_frac = 1.4     # release back to Intercept at range * this

# Offensive lag-pursuit blend: pure pursuit when nose-on (shoot him), sliding to
# LAG pursuit (aim BEHIND him) as the angle off grows -- that is what stops the
# bandit flying out in front and handing the player the reversal.
bfm_lag_dist_m     = 220.0  # [m] the lag point sits this far behind the player
bfm_lag_off_lo_deg = 20.0   # [deg] below this: pure pursuit
bfm_lag_off_hi_deg = 60.0   # [deg] above this: full lag

# High yo-yo: an overshoot PREDICTOR (too much closure at too big an angle off,
# held for arm_s so one noisy tick can't trigger it), then a committed climb at
# a deliberately UNLOADED bank -- the excess closure goes into altitude.
bfm_yoyo_closure_mps      = 40.0  # [m/s] closure that says "you'll overshoot"
bfm_yoyo_angle_deg        = 45.0  # [deg] ...at this much angle off
bfm_yoyo_arm_s            = 0.5   # [s] both must hold this long to arm (> 0)
bfm_yoyo_gamma_deg        = 30.0  # [deg] commanded climb (0, 80], and <=
                                 #   pursue_max_gamma_deg (30) -- the loader
                                 #   rejects a value that would escape the
                                 #   pursuit envelope (FIX-3)
bfm_yoyo_bank_frac        = 0.5   # fraction of pursue_max_bank kept climbing
bfm_yoyo_time_s           = 3.5   # [s] hard ceiling on the climb (> min_dwell_s)
bfm_yoyo_exit_closure_mps = 10.0  # [m/s] closure killed -> back to Offensive
bfm_yoyo_cooldown_s       = 2.0   # [s] the guns-hot spell length guaranteed
                                 #   between yo-yos (FIX-D duty-cycle dial,
                                 #   independent of bfm_min_dwell_s below)

# FIX-A (air-abort hysteresis band, replaces the round-2 bare climb_ok bool).
# The bandit's Yoyo air logic has TWO sides, each keyed to the downstream term
# it mirrors. ARMING is structural, not a dial: a fresh yo-yo may arm only
# where the flyable-air ceiling's air-seek dive is OFF (atm_frac >=
# avoid_air_frac_full) -- anywhere the seek is live, min(faded climb, seek) is
# a DESCENT, so "climb maneuver" would be a lie there (a measured guns-cold
# inversion loop). The ABORT side reads the ceiling's fade ramp (t in [0,1]):
# an ACTIVE yo-yo aborts only once t drops below climb_abort_t, deep in the
# fade -- the wide gap between the structural arm boundary (t == 1.0 exactly)
# and this floor is the hysteresis that lets a yo-yo whose own climb crosses
# the boundary COMPLETE on its normal exits instead of flapping (a measured
# 1-tick flap loop when arm and abort shared one threshold).
bfm_climb_abort_t = 0.25  # an ACTIVE Yoyo aborts only when climb_t < this

# Energy extend: specific energy is "how high could I be if I traded all my
# speed for altitude". Down by extend_energy_m (or grinding Offensive for
# frustration_s), unload into a shallow dive, rebuild, re-enter.
# FIX-F1 (docs/ai_phase2_fix_spec.md, Opus probe attribution): 600 -> 3000 —
# at 600 the bail tripped on 100% of foe==player ticks (Chad flies ~259 m/s
# vs the bandit's ~110, a permanent ~2800 m deficit), so every fight against
# the player left the ONLY guns-hot mode exactly min_dwell after entering it
# and never came back (the recovery threshold was unreachable). Scaled so a
# player-speed mismatch alone is not an auto-loss; frustration_s = 8.0
# becomes Offensive's governing exit, matching the healthy AI-vs-AI energy-
# matched behavior. Dial — flagged for Chad's stick.
# RUNG E1.3: 3000 -> 6000. e_delta reached -3985 m at the tape's player peaks,
# so even the FIX-F1 value still tripped the bail on a pure speed mismatch —
# and Extend is guns-cold. 6000 means "bail only on true energy death", not on
# the player being faster.
bfm_extend_energy_m  = 6000.0 # [m] specific-energy deficit that breaks it off
bfm_extend_gamma_deg = -10.0  # [deg] shallow unloaded dive [-45, 0)
bfm_extend_min_s     = 8.0    # [s] commit floor (> 0). game-AI-R5: 4 -> 8 —
                              #   the knife fight at 100-120 m/s has turn
                              #   radius ~= fight range (the measured endless
                              #   pure-pursuit spiral, killchain_handoff.md);
                              #   a LONG extend re-enters from 2.5-3 km so the
                              #   run-in aligns fully before gun range.
bfm_extend_max_s     = 16.0   # [s] commit ceiling -- never vanish (> min);
                              #   R5: 10 -> 16 to fund the longer extend.
# ★★ RUNG E6.3 PROPOSED 16 -> 8 HERE (and 8 -> 4 above, and frustration 12 ->
#    16 below) FOR CHAD'S "mostly they run". IT IS REFUSED ON MEASUREMENT, and
#    the numbers are written here so it is never silently retried:
#      P-A, 8 ensemble x 10 min per arm, rounds ON THE ACE / hits
#        shipped R5 table (8 / 16 / 12) ............ 39 rounds, 18 hits
#        the E6.3 proposal (4 / 8 / 12) ............ 31 rounds, 12 hits
#        frustration alone (8 / 16 / 16) ........... 24 rounds,  9 hits
#    R5's long extend is LOAD-BEARING for the kill chain, exactly for the
#    reason R5 gave: a short extend re-enters badly aligned and the run-in
#    never converges into the fire band. Shortening it buys "they run less"
#    with half the rounds on the ace — the one metric Chad's whole E-ladder
#    exists to raise, and the one the E6 acceptance says must not regress.
#    Raising frustration is worse still: it holds a pilot in an UNRESOLVED
#    Offensive instead of re-merging, and costs 38% of the rounds.
#    ALSO MEASURED, and worth knowing: bfm_extend_energy_m is a DEAD exit at
#    the shipped table (raising it 6000 -> 12000 changes nothing, 39/18 either
#    way) — frustration_s is the ONLY route into Extend that ever fires.
#    E6.3 therefore ships as the AGGRESSION POSTURE alone (aggression_range_m,
#    below): Extend is suppressed where Chad's complaint actually lives — while
#    the pilot's own objective is hot — instead of being shortened everywhere.
# RUNG E1.3: 200 -> 3000, RE-DERIVED REACHABLE. 200 was an absolute-deficit
# test a bandit structurally slower than the player could never satisfy (the
# tape's steady-state deficit is ~2800 m), so EVERY extend ran the full
# bfm_extend_max_s guns-cold and the recovery branch was dead code. 3000 sits
# just past that steady state — reachable the moment the extend has actually
# rebuilt anything — and still strictly below bfm_extend_energy_m (loader).
bfm_reenter_energy_m = 3000.0 # [m] the residual E DEFICIT that counts as
                              #   RECOVERED (FIX-7): re-arms once e_delta
                              #   climbs back above -this, not once it turns
                              #   into an outright surplus; must stay strictly
                              #   below bfm_extend_energy_m
# RUNG E1.3, the CLOSURE-SIGN exit. The absolute-deficit test above is the
# wrong instrument against a faster aircraft; the honest "I am ready to
# re-enter" signal is that the extend has turned back into a CLOSING geometry.
# Gated by the same bfm_extend_min_s commit floor, so it can never cut an
# extend short. 0 = off (the legacy recovery-or-timeout pair, bit-identical).
bfm_reenter_closure_mps = 25.0  # [m/s] closing rate that re-enters the fight

# Global pacing. Offensive/Yoyo reuse pursue_speed_bump above (this fleet's own
# in-fight speed dial) -- no second copy; Intercept/Extend get their own bump
# so the run-in/energy-rebuild legs tune independently of the in-fight speed.
# RUNG E1.3: 8 -> 12. With the energy bail no longer firing on a speed
# mismatch, frustration is Offensive's governing exit — 8 s ended a guns-hot
# spell before the closure into the fire band completed.
bfm_frustration_s        = 12.0  # [s] Offensive this long unresolved -> extend.
                                 #   RUNG E6.3 proposed 12 -> 16 and it is
                                 #   REFUSED on measurement — see the P-A table
                                 #   at bfm_extend_min_s above (24 rounds vs
                                 #   39). This is the ONLY exit into Extend
                                 #   that ever fires at this table.
bfm_intercept_speed_bump = 25.0  # [m/s] over cruise while closing / extending
# RUNG E1.2: 2.0 -> 0.5. The dwell latch is anti-chatter, but at 2 s it also
# pinned the machine in whatever mode it happened to be in through the exact
# seconds an ace grants a shot. The felt side of the faster machine is carried
# by bfm_mode_blend_s below (the C1 command blend), and the P-A probe pins a
# BFM transitions-per-minute bound so this cannot degenerate into chatter.
bfm_min_dwell_s          = 0.5   # [s] MINIMUM commitment to any mode (> 0) --
                                 #   without it the machine chatters and the
                                 #   bandit twitches instead of committing

# RUNG E1.1 THE CHASE CEILING. The measured G1 gate: the legacy Intercept /
# Extend ceiling is max(speed + bfm_intercept_speed_bump, speed +
# pursue_speed_bump*align^2) = 175 m/s nose-on and 110 m/s in any turn, against
# a player measured at 259 m/s mean / 362 peak — the bandit could NEVER close
# any non-head-on geometry. 265 raises the STRAIGHT-LINE chase ceiling to the
# player's own class; the align^2 fade is kept verbatim, so "chase fast, turn
# slow" (the ruled R4 corner-speed law) is untouched and an off-nose intercept
# still slows to turn. Armed only OUTSIDE bfm_attack_range_m — the merge itself
# keeps corner speed.
#
# ! NAMED RULED-PROPERTY REPEAL (spec P1-3), FOR CHAD'S FLY CHECKLIST: the
#   pursue_speed_bump note above ("stays well under the player's redline (245),
#   so a straight-line run still escapes — the fight stays beatable",
#   2026-07-26) is REPEALED by this dial. A level straight-line run no longer
#   outruns Intercept/Extend. Chad's "kill me" order is the authority; this is
#   his dial to walk back.
# 0 = OFF, and off means the LEGACY ALIGN-DEPENDENT expression runs
# bit-for-bit — there is no numeric "175-equivalent" that reproduces it.
