# the commanded speed/bank out of the previous tick's pair over 0.7 s
# (smoothstep), so a transition reads as a slew, not a twitch. 0 = off.
bfm_mode_blend_s = 0.7  # [s] C1 blend on a mode-change speed/bank command

# ---- RUNG E2 — THE BLACK STOPE OFFENSIVE -----------------------------------
# Chad's order: "smooth graceful killers... who will underground strafe and be
# capable of victory by pump destruction. They must actively and successfully
# enter the tunnel, fly into the black stope and attack our allied pumps."
