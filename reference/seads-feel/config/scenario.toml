# WHAT SURVIVES: nothing on this sweep is resolvable. The "wall is POINTING"
# conclusion still stands, but on E8.1 and on Chad's tape -- not on this table.
#
# SHIPPED AT 120 FOR CHAD'S STICK, NOT ON THE NUMBERS. Its crash rate is
# unchanged (0.063 vs 0.063 off; 210 raises it to 0.156).
# ★ AND THE OTHER HALF OF THAT SENTENCE IS WITHDRAWN (rung E9, red team P1-10):
# "the top arm on the hits column at BOTH ensembles" is a selection over a
# column the paragraph above just called unresolvable, taken on two ensembles
# that are NOT independent (n=32 and n=64 share all 32 turn/altitude phase
