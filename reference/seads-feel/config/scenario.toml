#   THIS IS NOT A BUG AND IT IS NOT NOISE, IT IS CAUSAL: the only thing that
#   damages a SUDBURY pump on this replay is the PLAYER attacking it, and when
#   the player is over the pump the pilots near it are in a fight with him. The
#   conjunction and the exclusion are the same event seen twice.
#
#   The machinery underneath is NOT dead -- arm D (this key false) arms 13
#   episodes with the identical geometry, arming and steering code. So the
#   whole of stage 0 flies; only this conjunction starves it.
#
#   ⚠ THE ONE QUESTION FOR CHAD, and it is his to rule, not mine to pick:
#   stage 0 as literally specified is unreachable while pursuit is unlimited.
#   The three ways out are (a) leave it exactly as ruled and accept it fires
#   only when someone else's guns damage the pump, (b) drop the pump-attack
#   condition (arm D: pressure 0.0392 -> 0.0255, a 35% OFFENSE CUT -- refused
#   here as an unrequested difficulty walk-back), or (c) let a regroup preempt
#   an ENGAGED tick, which directly contradicts "chase you anywhere".
#   NOTHING WAS QUIETLY PICKED: the literal ruling ships.
regroup_require_pump_attack = true
# Stage 1. The designated deck runner (raid_deck_run_slots) outside its own
# LIVE dome flies the same point home before the climb. A dome-less faction
# has home_alive = false, so it is NEVER ordered to a bubble that does not
# exist -- his "if they have one left".
#
# ★★★ SHIPS OFF, AND HERE IS THE NUMBER (rescue pass, 2026-08-27). It was
# authored ON. Stage 1 is the RETURN half of "go back to your bubble, climb,
# then parabolic dive" -- and THE CLIMB AND THE DIVE DO NOT EXIST YET
# (BallisticPhase::CLIMB has no body; that is the next agent's chunk). So with
# it on, the designated deck runner flies all the way home and then straight
# back out the way it came, having gained nothing. Measured on [.regroup],
# arm S (shipped) vs arm F (this key forced true), one replay, 22.4 min:
#
#   enemy pressure (on-station rate)  0.0392 -> 0.0367   = -6.4% OFFENSE
#   crashes/min                       0.45   -> 0.45     (no change)
#   deck survival                     0.526  -> 0.550
#   stage-1 returns armed             0      -> 1        (94 s under the order)
#
# That is a DIFFICULTY WALK-BACK bought for nothing, against the standing
# ruling "get out of easy mode and increase its ability to destroy pumps". It
# is one word from live and arm F measures it every gate run, so flipping it
# true in the SAME commit as the parabolic dive costs nothing.
#
# ★★★ RUNG D3 FLIPPED IT TRUE, in exactly that commit, AND IT COSTS EXACTLY
# ZERO -- measured, not argued. [.regroup] arm F (this key forced back OFF) is
# now BIT-IDENTICAL to the shipped arm: 0x2ec5baddc8346cfe on both, pressure
# 0.0417 -> 0.0417, and stage-1 returns armed 0 on BOTH arms.
#
# WHY, and it is a real finding rather than an absence: THE RETURN IS SHADOWED
# BY THE CLIMB. Stage 1 needs `ballistic == NONE` AND `own_frac > 1.0` (I am
# outside my own dome). D3's already-home arming fires at `own_frac <= 1.0` and
# latches CLIMB. On this replay the rank-0 deck runner's raid order always arms
# while it is still INSIDE its dome, so the CLIMB wins the race every time and
# the RETURN never has a NONE phase left to arm from. That is Chad's own
# sentence resolving itself -- "go back to whatever bubble IF THEY HAVE ONE":
# it has one, and it is already in it.
#
# ⚠ SO THE D2 PRICE IS GONE, AND NOT BECAUSE THE DIVE PAID IT OFF. The -6.4%
# pressure D2 measured was a machine where CLIMB could not arm. Stage 1's own
# flight is consequently NOT exercised at this head, and that is stated here
# rather than left for a green light to imply.
#
# It is ALSO gated on raid_ballistic_climb_agl_m > 0 in both the app and the
# fixture mirror, so the master dead switch below really does restore the
# pre-D3 machine bit-for-bit (arm O reproduces 0x12dd30472363fcf5) rather than
# leaving a lone return flying, which WOULD be a different machine.
regroup_return_deck_run = true

# ---------------------------------------------------------------------------
# ★★★ RUNG D3 — THE PARABOLIC DIVE / THE BALLISTIC DECK RUN (stages 2-5)
# ---------------------------------------------------------------------------
# CHAD, 2026-08-27, verbatim:
#   "they should go back to whatever bubble if they have one left, climb to a
#    decent altitude and then parabolic dive to the deck to cross the no air
#    zone to the enemy bubble to attack"
#   "It would be cool in general to see them climb up then perform a parabolic
#    dive toward the other bubble to hit the deck and cross at maximum speed,
#    even if they are pointed upward a bit they will sail to the other bubble"
#
# ★★★ THE HONEST HEADLINE, FROM THE INSTRUMENT THAT LANDED BEFORE THE FEATURE
# ([.bdeck], commit 77085cc32, control arm at HEAD):
#   * THERE IS ALMOST NO GAP TO BALLISTICALLY CROSS. Outside a dome the air is
#     FULL below game.toml deck_agl_m (120 m AGL) and zero only by +deck_soft_m
#     (320 m). The dead band is purely VERTICAL. The median crossing already
#     spends 0.0 s in dead air (mean 7.2, p90 18.3).
#   * ZERO of the 10 enemy wrecks die in thin air. All 10 die below 60 m AGL,
#     7 of 10 with a TUNNEL disposition (the bore grinder, the open C2 debt).
#     The "leave the dome at 1700-1900 m and mush down at 124 m/s" population
#     is the PRE-S1-DECK machine and no longer exists.
# SO: THE BALLISTIC PHASE IS THE DOME-SKIRT TRANSITION, not the crossing, and
# the crossing itself stays POWERED DECK FLIGHT under the S1-DECK law. This
# ships as SPECTACLE + ARRIVAL ENERGY. It is NOT sold as a crash fix, and the
# honest short-ballistic shape is the one that is built.
#
# ★ THE PHYSICS, and Chad's own sentence is it: sim/step.cpp scales thrust,
# lift AND drag by ONE f_atm, so outside the air the trajectory is EXACTLY a
# parabola and only the LAUNCH VECTOR and the ENERGY matter -- "even if they
# are pointed upward a bit they will sail". There is no authority out there to
# correct with, so THE RUN IS COMMITTED WHILE STILL IN AIR.
#
# ★ 0 = THE WHOLE-FEATURE DEAD SWITCH. It also re-gates
# regroup_return_deck_run above, so 0 is the pre-D3 machine bit-for-bit -- and
# that is a probe arm ([.bdeck] arm O), not a claim.
raid_ballistic_climb_agl_m = 2000.0
# [s] the climb timeout. It ADVANCES to the dive from whatever altitude was
# reached -- it NEVER aborts into nothing (E15's "a range limit wearing a
# timeout's clothes" is the failure this refuses). At the commanded 26 deg and
# the 123 m/s errand speed the ROC is 123*sin(26) = 54 m/s, so 2,000 m takes
# ~37 s and 60 covers it with the turn-in.
raid_ballistic_climb_max_s = 60.0
# [deg] THE COMMITTED DIVE ANGLE. Bounded by the pull-out inequality the loader
# checks, and every term of that inequality is DERIVED, not welded:
#     v^2 * (1 - cos gamma) <= n_eff * g * h_band
#     n_eff  = 0.5 * avoid_pull_net_g      (the mean-air proxy over the fade)
#     h_band = game.toml deck_soft_m       (the 320 -> 120 m fade the pull-out
#                                           has air in)
# At 245 m/s that caps gamma at 20.8 deg (1 - cos g <= 0.0654), so 18 clears
# with margin (1 - cos 18 = 0.0489). The MEASURED pull-up net g on this replay
# is p50 4.81 ([.bdeck] control arm, n=37682), so n_eff = 1.5 under-claims the
# airframe by more than 3x -- deliberately, the avoid_pull_net_g precedent.
raid_ballistic_dive_gamma_deg = 18.0
# [m/s] the dive + sprint speed target. Chad's "cross at maximum speed".
# ⚠ THIS IS A FREE DIAL, not a welded identity. It happens to equal
# aircraft.toml v_redline (245.0) today -- that is where the compression knee
# bottoms out -- but nothing here reads that table, so if v_redline moves this
# does NOT silently follow it. Stated, not implied (the law paid for ten
# times: a constant that describes another table stops describing it the
# moment that table moves).
raid_ballistic_dive_speed = 245.0
# [-] THE COMMIT GATE: cos of the HORIZONTAL heading error to the pump.
# ⚠ HORIZONTAL, and it is arithmetic: the climb is flown at avoid_gamma_deg =
# 26, so a FULL-3D unit velocity dotted against a horizontal great-circle
# bearing can never exceed cos(26) = 0.8988. A 3D gate at 0.94 -- the value
# the maverick TRANSIT arm-gate uses, where the leg is LEVEL and the 3D form
# is right -- could NEVER pass here. Every dive would then commit by timeout
# from ~3,500 m, which is the E16 "domes are DOMES, higher is a WIDER gap"
# trap, and this file's climb dial would go inert in the commit path.
raid_ballistic_align_min = 0.94
# [m] AGL at which the DIVE ends and the ordinary elevation laws take the
# channel back. ⚠ IT MUST CLEAR **BOTH** PULL-UP BANDS, and the loader checks
# both:
#   * the DECK latch, which arms on eff_agl = agl - avoid_lookahead_s(3.0) *
#     sink < deck_avoid_agl_enter_m(60). At -18 deg and 245 m/s the sink is
#     245*sin(18) = 75.7 m/s, so it arms at agl ~ 287 m. Handing over below
#     that lands the transition INSIDE a latched 26 deg panic climb with
#     wants_fire cleared -- higher and more gun-muted than the 115 m median
#     crossing this rung exists to reach.
#   * the IN-DOME band's release, avoid_agl_release_m = 400. The dive STARTS
#     inside the runner's own dome, so it crosses that band on the way down;
#     ending at or below 400 would hand over mid-latch. 500 is the same
#     clearance regroup_agl_m takes, for the same reason.
raid_ballistic_run_agl_m = 500.0

# ---------------------------------------------------------------------------
# RUNG E7 — THE KILLERS (Chad's ruling, 2026-08-20 evening: "I want killers to
# contend with. That is a rule." + BOTH doctrines approved)
# ---------------------------------------------------------------------------
#
# ! NAMED RULED-PROPERTY REPEAL, FOR CHAD'S FLY CHECKLIST. The R4/R5
#   corner-speed ruling that capped every drone at pursue_max_bank_deg = 55 is
#   REPEALED FOR ENGAGED FIGHTERS ONLY, tiered by trait aggression. THE WALL it
#   repeals was measured across every probe on this ladder: 55 deg of bank at
#   fight speed is ~7 deg/s of turn, against 25-40 deg/s of LOS rate from a
#   275 m/s player — no gun solution exists at that ratio unless he flies
#   straight. pursue_max_bank_deg itself is UNCHANGED and still loader-bounded
#   at 55: patrol, the tunnel brain, raid, defend, the strike divert and the
#   containment leash all still steer on it. The repeal exists at exactly one
#   seam, drone::engaged_bank_cap, consumed only inside the engaged pursue/BFM
#   branch. WALK-BACK IS ONE NUMBER: ace_bank_cap_deg = 0 (or 55).
#
# E7.1 THE ACES TURN. Tiers come from the pilot trait table
# (drone/maverick.h kMavericks, `aggression`):
#   ACE  (>= ace_aggression_min 0.75): PITVIPER .95, SHAFT .85, MURRAY .80,
#                                      GULCH .75            -> 72 deg (n=3.24)
#   MID  (>= mid_aggression_min 0.65): NICKEL .70, STOPE .70,
#                                      BOREAL .65           -> 65 deg (n=2.37)
#   BASE (the rest): SLAGHEAP .60, CANARY .55, LAMPLIGHT .50 -> the ruled 55
# The loader checks both caps against the AIRFRAME (nose-on fight speed vs
# V_stall * sqrt(n)) and against bank_slew_dps, config-relative.
# ★★★ RUNG E10 (Chad, 2026-08-23: "make them good"). 72 -> 83 / 65 -> 80.
# MEASURED ON THE PLANT (spec §E10.1, saturated turn, 30 deg bearing = the
# TRACKING regime, 144 m/s, deadband off so the cap is the only variable):
#     cap        72     76     78     80     83
#     turn deg/s  6.2    8.7   10.9   14.8   26.3   (30 deg bearing, 144 m/s)
#     n           1.9    2.5    3.1    4.1    7.2
# ★★ 78, NOT 80, AND THE REASON IS DYNAMIC not static. At 80 the plant still
# HOLDS the bank (101-103% of command) but the flight path swings 13.9 deg
# abeam -- half the fire cone, the very defect rung E9 was about. Worse, cap 80
# sits ON AN INSTABILITY BOUNDARY: sweeping pursue_track_pitch_gain at cap 80,
# bearing 50 reads clean at 1.5, CATASTROPHIC at 1.2 and 1.0 (111 and 141 deg
# of swing), then clean again at 0.8. A value that flips on a 20% move in an
# unrelated dial is not a value to hand a pilot. At 78 with the shipped pitch
# gain 1.5 every bearing is clean (swing 0.25/0.93/0.44/0.83).
# ★ AND IT PINS pursue_track_pitch_gain 1.5: at cap 78 the SAME sweep goes
# unstable at 1.2 and 1.0 (bearing 70/90). 1.5 is on the good side of that band
# and a future retune downward must re-take this measurement.
# ★ 80 IS THE MEASURED EDGE, and the rung tried to go past it and was refused:
# at 83 the plant stops FLYING the command anywhere but dead astern -- achieved
# bank 54%/50%/46% of the 83 handed out at 50/70/90 deg bearing, with 103-120
# deg of flight-path swing (spec §E10.4). A commanded number the aeroplane
# mushes is not a turn. The
# airframe's own limit is n_max = 32 (controller.toml) and the engaged path
# flies aoa_protect ON, so 83 deg (n = 8.2 level) is nowhere near departure.
# WHY IT MATTERS: turn rate is g*tan(phi)/V under a BANK limit and
# g*sqrt(n^2-1)/V under a G limit. The player flies the second (his tape: median
# 4.3 g in close, p90 16.6, max 25); the AI flew the first at n = 1.3-5.5. At
# his speed that is 72 deg/s against 8. Walk-back: 72 / 65.
ace_bank_cap_deg   = 78.0   # [deg] top-tier ENGAGED bank cap (0 = off = 55)
mid_bank_cap_deg   = 76.0   # [deg] middle-tier ENGAGED bank cap (0 = off)
ace_aggression_min = 0.75   # trait aggression for the top tier
mid_aggression_min = 0.65   # ...and for the middle tier
# ★ THE TRACKING DEADBAND, and it is NOT a hedge on the ruling -- the P-A
# ensemble forced it. A FLAT 72-deg cap COSTS 39 rounds on the ace / 18 hits
# and buys back 13 / 2. The in-band time is unchanged (10940 -> 11132
# drone-ticks: they get just as close for just as long); what collapses is
# wants_fire, 522 -> 162 ticks. More bank did not stop them getting there, it
# stopped them POINTING once they were -- a 72-deg-capable tracker at k_az 3.0
# saturates out to 24 deg of bearing instead of 18 and yanks its nose straight
# through the solution. That is the same over-gained tracker pursue_pull_deg's
# own 30-deg deadband was written to cure. So the raised authority arrives
# where it WINS (the reversal, off the nose) and fades to the ruled 55 where it
# LOSES (tracking, on the nose), through the SAME ramp the hard pull uses.
# Set hi <= lo for the FLAT cap (the arm measured above) -- the choice is his.
# ★★★ RUNG E10 -- THE DEADBAND IS OFF (hi <= lo is its ruled FLAT form, and
# the paragraph above is now HISTORY, not the shipped rationale).
# IT WAS RULED IN ON NOISE. The "39 rounds / 18 hits" it cites is the single
# LUCKIEST cell in the whole sweep (spec §E7.I), inside a noise band of 4-39
# rounds and 0-18 hits for arms that CANNOT fight differently. §E7.K re-took it
# at n=64, found rounds/hits below resolution, and kept the deadband on a CRASH
# argument alone.
# WHAT IT COSTS, measured (spec §E10.2, plant, 144 m/s, cap 83):
#     bearing        10 deg      20 deg      30 deg
#     deadband OFF   5.3 deg/s   15.4 deg/s  27.0 deg/s   bank 70.8/83.2/84.3
#     deadband ON    2.7 deg/s    2.7 deg/s   2.8 deg/s   bank 55.1/55.1/55.6
# Inside 30 deg of his tail -- the ONLY place a gun solution exists -- it hands
# the ruled 55 back. Raising the cap while it is on buys NOTHING.
# ★★ AND ITS STATED MECHANISM IS CAP-DEPENDENT, which nobody had measured
# (§E10.3, P-A n=64, cone_open/eng -- a DENSE pointing column, not a rare-event
# count): at cap 72 flat really IS worse (23.2 -> 16.3, the overshoot is real),
# but at cap 83 it REVERSES (24.2 -> 45.3). The deadband was protecting against
# a MARGINAL cap. With real authority it is pure loss.
# Walk-back: ace_bank_track_hi_deg = 90.0 restores the ramp.
ace_bank_track_lo_deg = 30.0  # full fade-back to 55 inside this angle off
ace_bank_track_hi_deg = 0.0   # <= lo = the FLAT cap (rung E10)
# ★★★ RUNG E10 -- THE ALTITUDE FADE, and it is what makes the flat cap
# SHIPPABLE. A sustained hard turn sinks by construction: at 78 deg of bank the
# vertical lift component is n*cos(78) = 0.21n, so at the 3.1 G the plant pulls
# there it holds 0.64 g against 1 g of weight. Measured on P-A at n=64, the
# flat 78/76 cap took terrain crashes from 0.063 to 0.266 per engagement (4.25x)
# and raising avoid_agl_enter_m to 400 bought back almost none of it (0.250) --
# the problem is the RECOVERY from 78 deg of bank, not when the pull-up fires.
# So the tier authority is faded by ALTITUDE and the two ramps multiply: a
# bandit needs the geometry AND the air. lo is the pull-up's own release
# altitude (below it the avoid branch owns the aeroplane); hi is measured.
# Walk-back: ace_bank_agl_hi_m = 0.0 (hi <= lo = no fade).
# ★★★ AND IT SHIPS OFF, BECAUSE THE MEASUREMENT REFUSED IT. The fade was built
# on the hypothesis above and it changed NOTHING: P-A n=64 read crashes/eng
# 0.265625 with the fade at 400/1200 and 0.265625 without it, identical to the
# digit. A deeper fade (400/1800) traded pointing away 1:1 for a small crash
# drop, which is just a lower cap wearing a fade's clothes.
# ★★★ THE CRASH CENSUS THEN KILLED THE WHOLE PREMISE. Recording the state one
# tick before every wreck: **engaged = 0 of 3**, pull-up ALREADY ARMED 3 of 3,
# AGL 2.3 m, gamma -58 deg, V 250 m/s (redline). The engaged bank cap applies
# ONLY to engaged drones, so it cannot be what kills them -- the crash-count
# difference between bank arms is the same parameter-space chaos that eats
# `rounds`, not a cost of authority. What kills them is an UNENGAGED drone in a
# redline dive that the forced pull-up fires on and cannot save (raising
# avoid_lookahead_s 3 -> 5 -> 7 -> 9 s moved the impact angle -58 -> -33 deg
# and the crash COUNT not at all: 3/3/4/3). That is a real defect with a known
# mechanism and it gets its own rung -- it is not a dial.
# The fade stays in the code (off, bit-identical) because the mechanism is
# sound and cheap; it is simply not this defect's cure.
ace_bank_agl_lo_m = 400.0   # [m] AGL at/below which the ruled cap is all he gets
ace_bank_agl_hi_m = 0.0     # [m] hi <= lo = OFF (measured: it changes nothing)

# E7.2 THE SLASHERS. The tiers that did NOT get the repeal cannot win a
# sustained turning fight against the ace, so they are given the doctrine that
# works at a turn-rate disadvantage: PERCH/SLASH energy attacks. Climb to a
# height advantage above and behind him, dive through at chase speed with the
# guns hot, zoom back out, re-perch. Never sustained-turn. This flag only
# SELECTS the doctrine per pilot; bfm_perch_height_m = 0 disables it outright,
# so either off-value alone restores rung E6 bit-for-bit.
# ★★ HELD OFF 2026-08-20 NIGHT — A DEFECT, NOT A PREFERENCE, AND CHAD'S RULING
# ("BOTH doctrines approved") IS NOT BEING OVERRIDDEN, IT IS BEING BLOCKED ON A
# BUG. THE SLASHER DOCTRINE HAS NEVER FIRED A ROUND THROUGH THE REAL FIRE
# PIPELINE. Every E7.2 test asserts the guns_hot MODE FLAG (hot in Slash, cold
# in Perch/Defensive) and nothing more; no test ever put a slasher through the
# actual fire gate. `probe P-D: the transiting striker fights back` — a SIGNED
# E3 rung — is the first fixture that did, and it reads rounds_at_player = 0
# with the doctrine on and passes 18/18 with it off. Cause isolated to this one
# dial, nothing else changed.
# The converged n=64 table shows the same signature from the other side: E7.2
# cuts rounds 2.6x (1.94 -> 0.75 per engagement) while hits hold. Read as
# "fewer, better passes" that is a feature; read next to P-D's hard zero it is
# more likely a fire gate the dive never satisfies (a steep slash's flight path
# lags its nose, and `coordinated` gates on exactly that). UNDIAGNOSED — it
# needs its own rung, and the E7.2 test file needs a leg that counts REAL
# ROUNDS, not a mode flag. This is the "verify the artefact, not the process"
# trap: every generator number is perfect and the aeroplane does not shoot.
# Turn back on with `true` once a slasher is measured putting rounds downrange.
slash_doctrine        = false
bfm_perch_height_m    = 700.0  # [m] altitude advantage that IS a perch (0 = the
                               #   doctrine is unavailable to everyone)
bfm_perch_release_frac = 0.45  # spend all but this of it -> the pass is over
                               #   (the Perch<->Slash hysteresis gap)
# RUNG E8.1 — THE PERCH STANDOFF. The perch sits this far BEHIND him, and it is
# its own dial because the tracking lag point (bfm_lag_dist_m = 220) put the
# perch essentially DIRECTLY OVERHEAD: a dive from 700 m up and 220 m back needs
# atan(700/220) = 72.6 deg against a pursue_max_gamma_deg = 30 clamp, so the
# slasher could not point at the target it perched over. Probe P-S measured a
# whole pass at a best cone cos of -0.106 (96 deg off the lead point) and ZERO
# rounds -- THAT, not the `coordinated` clause spec E7.N hypothesised (measured
# 100% OPEN), is why E7.2 was held off.
#   * loader-bounded: atan(height/lag) <= 0.8 * pursue_max_gamma_deg
#     => at 700 m / 30 deg the floor is 1572 m.
#   * and the perch must still be REACHABLE: sqrt(lag^2 + height^2) must stay
#     inside bfm_attack_range_m (2200) or `perched` never latches => ceiling
#     ~2085 m. The usable window is [1572, 2085].
#   * 0 = fall back to bfm_lag_dist_m, i.e. the pre-E8 (un-diveable) perch,
#     bit-for-bit. That is the knob-off arm.
bfm_perch_lag_m       = 1700.0 # [m] see the sweep in probe P-S
bfm_perch_max_s       = 6.0    # [s] ANTI-DITHER: a slasher that can never
                               #   out-climb its target still takes gun passes
bfm_slash_min_s       = 2.0    # [s] COMMIT floor on a firing pass — a pass
                               #   forced by bfm_perch_max_s starts with no
                               #   height advantage, so without this floor it
                               #   would bounce back to Perch on tick one and
                               #   the slasher would never fire at all
bfm_slash_time_s      = 5.0    # [s] ceiling on the pass
bfm_slash_break_m     = 250.0  # [m] flown through him -> zoom and re-perch

# E7.3 REAL EVASION (Chad: "They only tried to dodge my shots with elevator
# dipping up and down"). ATTRIBUTION: this machine has never had a DEFENSIVE
# branch at all — a bandit with the player on its six is still TRACKING him,
# and with its bank capped the only command left with real amplitude is the
# tracking gamma chasing a weaving player's altitude. That is the bob. The fix
# is a real break: a LEVEL turn into the attacker at this pilot's full E7.1
# bank authority, whose exits are the reversal (back into the fight mode, onto
# the man who just overshot) and the unloaded extension (Extend, which is
# already literally that maneuver). 0 = off.
bfm_defensive_range_m    = 1400.0  # [m] an attacker inside this may threaten
bfm_defensive_cone_deg   = 20.0    # [deg] how nose-on HIS nose must be to me
bfm_defensive_release_deg = 45.0   # [deg] the break releases past this (the
                                   #   hysteresis gap — must be WIDER than the
                                   #   arm cone)
bfm_defensive_arm_s      = 0.4     # [s] the threat predictor's own debounce
# ★ "UNDER FIRE" MEANS ROUNDS HAVE ARRIVED. Arming the break on the GEOMETRY
# alone (an attacker pointing at me) was measured on P-A to take the ensemble
# to ZERO rounds at the player: in a furball the player's nose sweeps across
# five bandits constantly, so every one of them breaks permanently and the wing
# never shoots again. A damaging hit therefore opens this memory window, and
# the geometry only decides WHO to break into.
bfm_defensive_memory_s   = 4.0     # [s] a hit keeps a pilot under fire
bfm_defensive_max_s      = 6.0     # [s] ceiling on one break
bfm_defensive_cooldown_s = 3.0     # [s] guaranteed guns-live spell after a
                                   #   break, or a bandit the player simply
                                   #   keeps his nose on never shoots again

[damage]
# Component damage model (docs/damage_model_plan.md, Fable-vetted): enemy rounds
# route their KE to the engine / pilot / wings / structure by impact GEOMETRY, and
# each hurt component RESHAPES the flight via a PURE transform on the FROZEN kernel
# params (the same "world modulates, kernel frozen" firewall the bandit AI uses).
# Every dial below is IDENTITY at zero damage, so the gate + firewall stay
# bit-identical; the flight only diverges once a part is hit. Tune the "hurt-plane
# feel" here WITHOUT a recompile. These are the Fable-tuned defaults.

# Severity -> effect, at FULL component damage (fraction of the base param lost /
# gained). Higher = a hit bites harder.
wing_cl_loss     = 0.5   # fractional Cl_max & Cl_alpha loss (stall-alpha invariant)
wing_roll_loss   = 0.6   # fractional roll authority (c_roll) loss
wing_drag_gain   = 0.8   # Cd0 addend as a fraction of base (a torn wing drags)
struct_auth_loss = 0.55  # fractional pitch/yaw/roll authority loss
struct_drag_gain = 0.5   # Cd0 addend as a fraction of base
roll_bias_gain   = 0.5   # roll INPUT bias per unit wing asymmetry (a wing-heavy lean)
roll_bias_n_ref  = 2.0   # load factor at which the roll bias reaches full (> 0)

# Controllability FLOORS (fraction of the base param; keep the worst legal airframe
# degraded-but-flyable — never zero-authority, never a divide-by-zero). Must be in
# (0, 1]: a floor of 1 disables the effect, 0 would brick the plane.
pilot_gain_floor  = 0.35  # controller gain scale at pilot = 0 (a wounded pilot wallows)
cl_floor          = 0.5   # Cl scale never below this
c_pitchyaw_floor  = 0.35  # pitch/yaw authority never below this
c_roll_floor      = 0.25  # roll authority never below this
cd0_cap_mult      = 2.0   # Cd0 never more than this * base (a shredded plane mushes,
                          #   it does not brick); >= 1 (drag only ever rises)

# How much KE a component absorbs before it is destroyed (higher = tankier). A
# separated wing / dead pilot / dead structure is a KILL.
component_hp = 60.0  # [HP-equivalent KE] to destroy a component from full (> 0)

# Hit ROUTING region extents, as a fraction of the hit radius R (which region of
# the body-frame the impact falls in picks the component). A long-thin fuselage vs
# a ~9 m hit sphere means these are BANDS off the CG, not an argmax.
route_wing_frac    = 0.35  # |body x| beyond this*R -> a wing (in (0, 1))
route_nose_frac    = 0.25  # body z below -this*R -> engine (nose) (in [0, 1))
route_tail_frac    = 0.25  # body z above +this*R -> structure (tail) (in [0, 1))
route_center_pilot = 0.35  # center/cockpit hit: pilot's share (rest -> structure)
ground_wing_ref_ms = 40.0  # R4-FLY-5 (Chad: wings DAMAGE on terrain strike): scrape
                           # speed [m/s] at which a wing chips at the full rate
ground_wing_rate   = 3.0   # wing health lost per second of ground contact AT the ref
                           # speed, scaled (v/ref)^2 — a 40 m/s strike shreds a wing in
                           # ~0.33 s of scraping, a 10 m/s tip-drag chews it slowly.
                           # PLACEHOLDER — Chad's stick.

[sled_comfort]
# ★ RC ROLL COMFORT (Chad's §0b ruling, 2026-08-12: "arcadey to a degree so
# that it is fun... just make it more stable... all the mechanisms available
# for tuning"). Every dial has an OFF value so the whole rung tunes back to
# the pre-RC kernel from this file. Provenance + measured sizing:
# Game_loop_idea/vehicle_program/ROLL_COMFORT_CONSULT.md and
# docs/roll_envelope_baseline.txt (the before table).

# D — the rolled readout: >75 deg must HOLD this long, in ground contact this
# recent, before ROLLED latches (and cuts throttle). A jump is not a rollover:
# mid-air attitude NEVER latches. persist 0.0 = the old instantaneous readout.
rolled_persist_s = 0.30
rolled_grace_s   = 0.20

# A — the stability assist ("the sway bar that doesn't exist"): saturating
# restoring torque about the roll axis, contact-gated (zero airborne), that
# RELEASES between release_lo..hi rad so abuse still rolls (70 deg trip entry
# measured ROLLED; 60 caught). stiff 0.0 = OFF. Damping ships 0.0 on purpose —
# it is the dial that kills flick/drift/backflip feel; raise only if a bump
# leg still rolls. ref_blend: 0 = gravity-relative, 1 = surface-relative;
# 0.5 measured best (flat identical, 20-deg side-hill drift halves, berms
# only half-fought).
roll_stiff_nm       = 450.0
roll_ref_rad        = 0.14
roll_release_lo_rad = 0.60
roll_release_hi_rad = 1.20
# ★ GI4: 0.0 -> 800.0 on Chad's ruling 2026-08-13, against the consult's
# do-not list. Earned from his own 512 s tape (25->90 deg of roll in a median
# 0.20 s, to 654 deg/s, with no roll damping anywhere in the machine) and
# structurally unable to reach the air -- the term is multiplied by
# w_contact, identically 0 with no ground under the patches, so air flick and
# backflip initiation off a lip are untouched by construction. See
# docs/gi4_ride_handoff.md §5.
roll_damp_nms       = 800.0
roll_ref_blend      = 0.5

# B — lean is the REWARD channel: leaning INTO the demand multiplies bite
# (full-lock radius 95 -> 75 m measured); leaning wrong gives exactly nothing,
# never a penalty. sat_gain: committed lean extends the assist's release band
# (carry more roll angle before it lets go). 0.0 = OFF.
lean_bite_gain    = 0.18
lean_sat_gain_rad = 0.15

# ★ GI3 ROLLFIX (2026-08-13, from the R3 sink trace of Chad's own taped 360
# roll — provenance in sim/sled.h at these fields and GI3_ROLLFIX_HANDOFF.md).
# The measured hole: at 32-70 deg the patches unload onto the HULL and the
# assist's patch-only contact gate zeroed it with the release band still at
# 0.96 — then the ceiling (450 saturated through every pre-roll window at
# speed) and finally the hard release let the carve go. Three dials, each
# 0.0 = OFF bit-exactly:
# assist_hull_frac: fraction of the hull's side load counted as contact for
#   the assist (a machine on its running-board is not airborne).
# roll_stiff_vgain: authority grows with ground speed — stiff * (1 + g(v) *
#   vgain), g(v) smoothsteps over [assist_v_lo_ms, assist_v_hi_ms].
# release_floor_frac: the release band keeps this floor at speed (never
#   hard-abandons a live carve; the S4 oscillator fix), fading to exactly 0
#   by release_floor_hi_rad so a downed machine still gets no push, and 0
#   below assist_v_lo_ms so low-speed abuse still rolls.
# --- R4a SEATED SELF-RIGHT (Chad, 2026-08-26) --------------------------------
# "IF ON THE SEAT AFTER A ROLLOVER PRESSING THE STAND BUTTON AS IN REGULAR
#  SEATED OPERATION WILL RIGHT THE SLEIGHT ONTO ITS SKIS ... MACHINE NEEDS TO BE
#  TIPPING OVER ... NOT ABOVE 5KM/H ... IT CAN FAIL TO RIGHT GIVEN THE
#  SITUATION, PROGRESSIVE HOLD"
#
# right_assist_nm: the roll torque a FULL stand applies while tipped and slow.
#   Scales with how hard he stands, so a half shift does half.
#
#   ★ THE SCALE, DERIVED FROM THIS MACHINE -- and note where the honest number
#   lands. A pure static weight shift is rider 87.5 kg x lean_lat_stand_m 0.35 m
#   x g = 300 N m. Gravity's tipping torque is mass 331 kg x cg_height_m 0.564 m
#   x g x sin(tilt) = 626 N m at 20 deg, 1295 at 45 deg, 1831 flat on its side.
#   So a pure weight shift wins only below 9.4 deg -- BELOW the 20 deg gate --
#   and shipped at 300 this mechanic would be DEAD: it could never right
#   anything the gate lets it touch.
#
#   900 N m is 3x that shift, which is what a rider actually does: he stands on
#   the uphill board, hauls on the bars and pushes with his legs -- he does not
#   politely lean. At 900 the assist wins out to ~29 deg of tilt and LOSES
#   beyond it, which is exactly the ruled behaviour: a tip you catch early comes
#   back, one that has gone over does not, and then you press R.
#
#   ⚠ THIS IS A STARTING POINT FOR CHAD'S DRIVE, NOT A FLOWN VALUE. Nobody has
#   ruled it. Raise it to catch deeper tips (1295 would win to 45 deg), lower it
#   to make the save harder. 0.0 turns the whole mechanic off and is what every
#   .sledtape replays with, so the corpus stays bit-exact either way.
# ★ v2, after Chad drove v1 and it did nothing: 900 stalls at 46 deg (the
#   resist is m*g*d about the CONTACT PIVOT, arm = hypot(0.19, 0.564) =
#   0.595 m, peak 1932 N m) and v1's sin-shaped error was ZERO at 180 deg.
#   1500 gives a one-press ceiling of 18.6 + asin(1500/1932) = 70 deg, so a
#   moderate tip rights on ONE press and anything beyond is honestly in the
#   pumping regime. Chad rules the final value on his drive.
right_assist_nm          = 2400.0
# His 5 km/h, in m/s. Hysteretic: releases here, re-arms at 0.8x, so a machine
# hovering at the threshold cannot chatter the assist on and off.
# ★ SLED KERNEL v2, Chad-driven 2026-09-18, identity = 1.3888888888888888.
# He raised his own 5 km/h himself, in the seat: "4 is approved I can land
# upright more often" (drive run 4). The measured blocker was that the righting
# pump only armed below 1.3889 m/s and was open 13-20 % of the time he was over.
# `SEADS_SLED_RIGHT_MAXSPD` still overrides this line (kill switch + A/B).
# ⚠ This key now DIVERGES from sim::SledComfort{}.right_assist_max_ms on
# purpose: that struct default is the TAPE-ABSENT reconstruction and stays at
# the identity. scenario_sled_comfort_matches_kernel_defaults does not and must
# not cover the two v2 keys.
right_assist_max_ms      = 4.0
right_assist_rearm_frac  = 0.8
# "MACHINE NEEDS TO BE TIPPING OVER" -- 0.35 rad = 20 deg. Below this the assist
# does nothing, so it can never be free roll stiffness in ordinary riding. The
# speed gate is the other half of that guard: at 20 deg of lean you are carving,
# not tipping, and a carve is never under 5 km/h.
right_assist_min_tilt_rad = 0.35   # kept for the loader; the RAMP below owns the gate
# v2 rocking dials. push/rest are derived from the machine's own measured
# rock half-period (~0.93 s about the rail pivot): one press ~ one upswing,
# one release ~ one return. dir_eps/seed_frac are sin(10 deg): the direction
# saturates outside a 10 deg cone about inversion, and a full LEAN counts
# like 10 deg of attitude error -- his lean is what picks the side.
right_charge_push_s      = 0.6
right_charge_rest_s      = 0.7
right_dir_eps            = 0.04
right_seed_frac          = 0.1736
right_tilt_lo_rad        = 0.25
right_tilt_hi_rad        = 0.35
# The gate reads a LOW-PASSED speed: a healthy rock sways the CG at ~1.4 m/s,
# above the 1.389 gate, so a raw reading would disarm the assist mid-swing.
right_speed_lp_s         = 0.5
# The pump alignment scale: the press does full work when it goes WITH the
# rock and ~none when it fights the return. This is what makes timing a
# skill and what lets several pushes beat one.
right_pump_omega_eps     = 0.35
# Standing commands its own weight shift toward the push -- his ruling,
# and the state the leg-push animation is posed from. 1.0 = full reach.
# ★ SLED KERNEL v2, Chad-driven 2026-09-18, identity = 1.0. "5 is approved"
# (drive run 5) at 0.5: the brace commands HALF the reach, so his own rocking is
# live and the TIMING of the press starts to matter (measured: the timed-rock
# advantage grows as this falls -- 0.29 s at 1.0, 0.58 s at 0.5, and at 0.25 and
# 0.0 a mistimed rock never rights her from inversion at all).
# `SEADS_SLED_STAND_SHIFT` still overrides this line. Same divergence note as
# right_assist_max_ms: the struct default stays at the identity 1.0.
right_stand_shift_frac   = 0.5
assist_hull_frac     = 0.5
roll_stiff_vgain     = 1.0
release_floor_frac   = 0.3
release_floor_hi_rad = 1.45
assist_v_lo_ms       = 6.0
assist_v_hi_ms       = 16.0

# C — the on-side story: coarse hull contacts (tunnel edge, bar ends, ski
# outers) so a downed machine rests ~65-75 deg instead of flopping inverted,
# plus a righting bias that only AMPLIFIES side-slide momentum (zero below
# vmin: stationary machines NEVER self-right). At 900, a fast side-slide
# pops back onto the skis; slow tips stay down — momentum decides, "not every
# time but allow it". side_k 0.0 = hull OFF (which also disables the bias —
# no hull, nothing to pivot on); gain 0.0 = bias OFF with the hull kept.
side_k             = 30000.0
side_c             = 2500.0
# ★ GI S3 (2026-08-12): 0.30 -> 0.55 (downed-machine hull friction, packet C
# G5 -- the spin-top fix's friction half; the geometry half is the 10-point
# hull line + the side_yaw_mu arrest channel, kernel-default dials).
side_mu            = 0.55
# ★ GI S3: 1400 -> 700. At 1400 the bias injected ~3.4x the tipping barrier's
# energy and FLIPPED THE MACHINE THROUGH -- the RC1 corkscrew, measured
# (gi_measurements.md). 700 + the kernel's rate gate rights with momentum and
# cannot outwork the barrier.
side_right_gain_nm = 700.0
side_right_vmin_ms = 1.5
side_right_vref_ms = 6.0
