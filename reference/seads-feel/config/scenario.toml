# straight-line run no longer outruns Intercept" -- HAS NEVER ONCE BEEN FLOWN.
# The fade quietly put the escape property back. This key repeals it for real.
#
# ★ SCOPE. ONLY the Intercept consumer moves (drone/bfm.h, its own
#   intercept_ceiling lambda):
#     - EXTEND (the FLEE mode) keeps the faded ceiling verbatim. Chad's ruled
#       ASYMMETRY: pursuit may go anywhere, EVADE STAYS CONTAINED. Rewriting the
