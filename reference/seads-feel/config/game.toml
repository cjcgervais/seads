[interact]  # L1 THE MILLWRIGHT LOOP -- the diegetic reach law
# (docs/PLAN_20260901_game_loop_millwright.md §3; app/interact.h).
#
# Every key in this loop is a key AT A POSITION. These are the positions, in
# metres, and they are the ONLY thing that decides whether J / F / O do
# anything. Chad's ruling R5, 2026-09-01: "Sudburian stands and walks to the
# snowmachine, gets on with a button ... fix the pumps by driving up, getting
# off, then making the fix."
sled_reach_m = 2.5      # walk this close to the snowmachine and J gets you on
aircraft_reach_m = 3.0  # ... and this close to the parked aeroplane to board it
gun_reach_m = 3.0       # the flak gun's approach mark (no gun on this branch --
                        # the site kind exists, nothing registers one yet)
dismount_side_m = 0.9   # how far LEFT of the machine's centreline he steps off
dismount_stop_ms = 1.0  # you do not step off a snowmachine moving faster than
                        # this [m/s]

[repair]  # L1 registered the sites and the prompt; L2 owns the progress clock
# and the only second writer of pump hp (combat/pump_repair.h).
#
# Chad's ruling R2, 2026-09-01: "the fix should take about a minute to full
# restore." full_s is the time from ZERO HP to full, so a merely damaged pump
# finishes sooner in exact proportion to the damage left in it.
reach_m = 8.0  # stand this close (along the ground, to the pump's FOOT) to an OWN
               # surface pump that is dead or damaged. 2026-09-06: 6 -> 8 with the
               # pump house now standing on the ground, 12 m wide -- the prompt
               # lights at its wall, an arm's length out (Chad: "it needs to come
               # down").
               # and F starts the fix
full_s = 60.0  # seconds of SIM time from 0 hp to max_hp (never a frame clock)
repair_points = 0  # score for putting a pump back. 0 = OFF and 0 SHIPS: Chad
                   # has not ruled a number and an invented one would be a guess
                   # wearing a dial's clothes.
#
# ★★★ L10 THE ENGINE FIX (Chad 2026-09-07: "allow the sudburian to fix the
# airplane engine when it says engine out, the same way the sudburian can fix
# the pump"). Its own pair, never the pump's: the two jobs share a key, a pose
# and a law, and they share NO number.
engine_reach_m = 5.0  # stand this close (along the ground, to the aeroplane's CG)
                      # to work on its engine. Wider than [interact]
                      # aircraft_reach_m = 3.0 because boarding happens at the
                      # cockpit and the wrench happens at the nose, and he must be
                      # able to stand clear of a wing.
engine_full_s = 45.0  # seconds of SIM time from a DEAD engine to a whole one. NOT
                      # the pump's 60: the pump's minute is Chad's ruling about a
                      # thing with a match clock running against it, and a parked
                      # aeroplane has no such race. A dial, not a ruling.

[spawn]  # L3 WHERE THE PLAYER IS BORN (plan §4.3; app/spawn_policy.h)
#
# Chad's ruling R4, 2026-09-01: "knowing from flying it's almost always death
# spawning in where we do, so the ability to fix a pump should be allowed
# through respawn straight into the snowmachine from a set distance away from
# the pump."
#
# The machine is set down this far from the pump ALONG THE SURFACE, on the
# bearing from the pump toward your own faction's bubble centre -- i.e. on YOUR
# side of it -- and facing the pump, so the objective is on screen from the
# first frame. Open question 3 for Chad: is 300 m the right ride?
sled_dist_m = 1000.0
# ... and the aeroplane is parked this far to the machine's right, grounded and
# stopped, so a snowmachine spawn never costs you the aircraft. Same 5 m gap the
# KEY_J mount seed leaves between the two bodies.
aircraft_beside_m = 5.0
